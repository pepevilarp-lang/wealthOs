<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

<style>
/* ═══════════════════════════════════════════════════════════════════
   WealthOS v2 — Premium Wealth Platform
   Paleta: blanco + navy #1B4FD8
   ═══════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F4F6FA;
  --bg-elev:#FFFFFF;
  --surf:#FFFFFF;
  --surf-2:#F8FAFC;
  --surf-3:#EEF2F7;
  --surf-4:#E2E8F0;
  --line:rgba(15,28,60,.07);
  --line-2:rgba(15,28,60,.04);
  --line-strong:rgba(15,28,60,.14);
  --brand:#1B4FD8;
  --brand-d:#1540B8;
  --brand-l:rgba(27,79,216,.10);
  --brand-bg:rgba(27,79,216,.05);
  --brand-deep:#0F1C3C;
  --pos:#0C9B6A;
  --pos-d:#067A52;
  --pos-bg:rgba(12,155,106,.05);
  --neg:#D84D42;
  --neg-d:#B83A30;
  --neg-bg:rgba(216,77,66,.05);
  --warn:#B45309;
  --warn-bg:rgba(180,83,9,.05);
  --info:#0284C7;
  --info-bg:rgba(2,132,199,.05);
  --t-1:#0F1C3C;
  --t-2:#475569;
  --t-3:#78828F;
  --t-4:#CBD5E1;
  --c-cash:#0284C7;
  --c-bolsa:#1B4FD8;
  --c-fondos:#8B5CF6;
  --c-pe:#F97316;
  --c-inmob:#EC4899;
  --c-otros:#6B7280;
  --sh-sm:0 1px 2px 0 rgba(0,0,0,0.05);
  --sh-md:0 4px 6px -1px rgba(0,0,0,0.1);
  --sh-lg:0 10px 15px -3px rgba(0,0,0,0.1);
  --sh-xl:0 20px 25px -5px rgba(0,0,0,0.1);
  --display:Fraunces,serif;
  --sans:Inter,sans-serif;
  --mono:JetBrains Mono,monospace;
}

html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--t-1);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ─── LAYOUT ─── */
.layout{display:grid;grid-template-columns:280px 1fr;grid-template-rows:60px 1fr;height:100vh;gap:0}
.sb{grid-column:1;grid-row:1/3;background:var(--brand-deep);color:white;overflow-y:auto;border-right:1px solid var(--line-strong);display:flex;flex-direction:column}
.topbar{grid-column:2;grid-row:1;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:24px}
.pages{grid-column:2;grid-row:2;overflow-y:auto;position:relative}
.page{display:none;opacity:0;transition:opacity 0.2s}
.page.active{display:block;opacity:1}

/* Mobile */
@media(max-width:768px){
  .layout{grid-template-columns:1fr;grid-template-rows:60px 1fr 60px}
  .sb{grid-column:1;grid-row:1;position:fixed;left:-280px;top:0;width:280px;height:calc(100vh-60px);z-index:100;transition:left 0.3s}
  .sb.open{left:0}
  .topbar{grid-column:1;grid-row:1;position:relative;z-index:99}
  .pages{grid-column:1;grid-row:2;padding-bottom:60px}
  .mob-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surf);border-top:1px solid var(--line)}
  .mob-btn{padding:10px;text-align:center;font-size:11px;cursor:pointer;color:var(--t-3);transition:all 0.2s}
  .mob-btn.active{color:var(--brand)}
}

/* ─── SIDEBAR ─── */
.sb-head{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--display);font-size:18px;font-weight:600}
.sb-nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:4px}
.sb-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.7);transition:all 0.2s;display:flex;gap:10px;align-items:center}
.sb-item:hover,.sb-item.active{background:rgba(255,255,255,.1);color:white}
.sb-section{padding:12px;margin-top:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:rgba(255,255,255,.4);display:none}
@media(max-width:768px){.sb-section{display:block}}

/* ─── TOPBAR ─── */
.top-logo{font-family:var(--display);font-size:16px;font-weight:600;color:var(--brand)}
.top-info{flex:1;display:flex;gap:8px;flex-direction:column}
.top-h1{font-size:16px;font-weight:600;color:var(--t-1)}
.top-sub{font-size:11px;color:var(--t-3)}
.top-actions{display:flex;gap:8px}

/* ─── CARD ─── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;transition:all 0.2s;box-shadow:var(--sh-sm)}
.card:hover{box-shadow:var(--sh-md);border-color:var(--line-strong)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--t-1)}
.card-ti{margin-bottom:2px}
.card-sub{font-size:11px;color:var(--t-3);font-weight:400}
.card-bd{font-size:13px;color:var(--t-2);line-height:1.6}

/* ─── BUTTONS ─── */
.btn{
  padding:10px 14px;
  border-radius:8px;
  border:none;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s;
  font-family:var(--sans);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn-primary{background:var(--brand);color:white}
.btn-primary:hover{background:var(--brand-d);box-shadow:var(--sh-md)}
.btn-soft{background:var(--brand-bg);color:var(--brand)}
.btn-soft:hover{background:var(--brand-l)}
.btn-ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn-ghost:hover{background:var(--brand-bg)}
.btn-sm{padding:7px 10px;font-size:12px}
.btn-xs{padding:5px 8px;font-size:11px}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* ─── KPI ─── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--line)}
.kpi:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh-md)}
.kpi-l{font-size:12px;font-weight:500;color:var(--t-3);text-transform:uppercase;letter-spacing:0.5px}
.kpi-v{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--t-1)}
.kpi-s{font-size:11px;color:var(--t-4)}

/* ─── INPUT ─── */
.fi{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--sans);
  font-size:13px;
  color:var(--t-1);
  transition:all 0.2s;
  background:var(--surf-2);
}
.fi:focus{outline:none;border-color:var(--brand);background:var(--surf);box-shadow:0 0 0 3px var(--brand-bg)}
.fi::placeholder{color:var(--t-4)}

/* ─── FIELD ─── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field-l{font-size:12px;font-weight:600;color:var(--t-2);text-transform:uppercase;letter-spacing:0.5px}

/* ─── MODAL ─── */
#modal-root{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
#modal-root.open{display:flex}
.modal{background:var(--surf);border-radius:12px;box-shadow:var(--sh-xl);max-width:500px;width:90%;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:10}
.mh-t{font-size:16px;font-weight:600;color:var(--t-1)}
.mh-c{background:none;border:none;font-size:24px;color:var(--t-3);cursor:pointer;transition:color 0.2s}
.mh-c:hover{color:var(--t-1)}
.mb{padding:24px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:18px;border-top:1px solid var(--line)}

/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surf-3);padding:12px;text-align:left;font-weight:600;color:var(--t-1);border:1px solid var(--line)}
.tbl td{padding:12px;border:1px solid var(--line);color:var(--t-2)}
.tbl tr:hover td{background:var(--surf-2)}
.tbl .r{text-align:right}
.tbl .mono{font-family:var(--mono)}

/* ─── UTILITIES ─── */
.pc{padding:24px}
.section-h{font-size:14px;font-weight:600;color:var(--t-1);text-transform:uppercase;letter-spacing:0.5px;margin:24px 0 12px;padding:0 24px}
.empty{text-align:center;padding:40px;color:var(--t-3)}
.empty-ic{font-size:32px;margin-bottom:12px;opacity:0.3}
.empty-t{font-size:14px;font-weight:600;color:var(--t-2);margin-bottom:6px}
.empty-s{font-size:12px;color:var(--t-3);max-width:300px;margin:0 auto}
.warnmsg{background:var(--warn-bg);border:1px solid rgba(180,83,9,.2);border-radius:8px;padding:12px;color:var(--warn);font-size:12px;margin-bottom:12px}
.dots{display:inline-flex;gap:4px}
.dots span{width:4px;height:4px;background:currentColor;border-radius:50%;animation:pulse 1.5s infinite}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* ─── AUTH ─── */
.auth{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand) 100%);font-family:var(--display)}
.auth-box{background:white;border-radius:12px;padding:40px;box-shadow:var(--sh-xl);width:100%;max-width:400px}
.auth-title{font-size:28px;font-weight:500;color:var(--t-1);margin-bottom:8px;text-align:center}
.auth-sub{font-size:13px;color:var(--t-3);text-align:center;margin-bottom:24px}

</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sb" id="sidebar">
    <div class="sb-head">W WealthOS</div>
    <nav class="sb-nav" id="sb-nav"></nav>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-xs" onclick="toggleSidebar()" style="display:none" id="mob-toggle">☰</button>
      <div class="top-logo">WealthOS</div>
    </div>
    <div class="top-info">
      <div class="top-h1" id="top-h1">Dashboard</div>
      <div class="top-sub" id="top-sub">Tu patrimonio en un vistazo</div>
    </div>
    <div class="top-actions">
      <button class="btn btn-soft btn-xs" id="user-btn">👤 Usuario</button>
    </div>
  </div>

  <!-- PAGES -->
  <div class="pages" id="pages"></div>

  <!-- MOBILE BAR (solo mobile) -->
  <div class="mob-bar" id="mob-bar"></div>
</div>

<!-- MODAL -->
<div id="modal-root"></div>

<!-- AUTH (hidden until needed) -->
<div class="auth" id="auth-screen" style="display:none">
  <div class="auth-box">
    <div class="auth-title">Modo Demo</div>
    <div class="auth-sub">Explora WealthOS sin registro</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="enterDemo()">
      Entrar
    </button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// WEALTHOS v2 — PREMIUM WEALTH PLATFORM
// ═══════════════════════════════════════════════════════════════════

/* STATE */
const STATE = {
  user: null,
  blocks: [],
  docs: [],
  history: [],
  flujos: [],
  chat: [],
  demo: false,
  currentPage: 'dashboard'
};

const SB_URL = 'https://rjjfuzeapeasgdobnwbp.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqamZ1emVhcGVhc2dkb2JuaHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTU0MjExNjAsImV4cCI6MTgxNjU1MzE2MH0.SqaHplLVZq3f4-bHZ_N3pwJdvLbvuKjmxRQYVW4phRs';

let sb = null;
let charts = {};

/* UTILITIES */
const $ = (id) => document.getElementById(id);
const $$ = (sel) => document.querySelectorAll(sel);
const val = (id) => ($(id)?.value || '').trim();
const txt = (id, t) => { const e=$(id); if(e) e.textContent=t; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fE = (n) => (typeof n === 'number' ? n.toLocaleString('es-ES', {maximumFractionDigits:0}) : '-') + '€';
const fE2 = (n) => (typeof n === 'number' ? n.toLocaleString('es-ES', {maximumFractionDigits:2}) : '-');
const fP = (n) => (typeof n === 'number' ? n.toFixed(1) + '%' : '-');
const fD = (d) => new Date(d).toLocaleDateString('es-ES', {day:'numeric',month:'short',year:'numeric'});
const gId = () => Math.random().toString(36).slice(2, 9);
const toast = (msg, type='info') => { console.log(`[${type}]`, msg); };

/* INIT */
async function init() {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  
  // Check auth
  const { data } = await sb.auth.getSession();
  STATE.user = data.session?.user;

  if (!STATE.user) {
    enterDemo();
  } else {
    loadApp();
  }
}

function enterDemo() {
  STATE.demo = true;
  STATE.user = { id: 'demo', email: 'demo@wealthos.local' };
  loadDemoData();
  loadApp();
}

function loadDemoData() {
  STATE.blocks = [
    {id:'d1',type:'cash',name:'Openbank',value:8400,eur_value:8400,currency:'EUR',notes:'Cuenta corriente',extra:{remunerada:false},updated_at:new Date().toISOString()},
    {id:'d2',type:'bolsa',name:'IBKR Cartera',value:18650,eur_value:18650,currency:'EUR',notes:'5 posiciones',extra:{broker:'Interactive Brokers'},updated_at:new Date().toISOString()},
    {id:'d3',type:'pe',name:'Inveready Full Global II',value:4500,eur_value:4500,currency:'EUR',notes:'SCR VC',extra:{committed:25000,called:4500,tvpi:1.10,dpi:0},updated_at:new Date().toISOString()},
  ];

  const now = new Date();
  STATE.history = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    STATE.history.push({ date: d.toISOString().slice(0,10), total: 30000 + Math.random()*3000 });
  }
}

function loadApp() {
  renderNav();
  renderPages();
  renderMobileBar();
  goto('dashboard');
}

/* NAVIGATION */
function renderNav() {
  const nav = $('sb-nav');
  const sections = [
    {label:'Principal', items:['dashboard','patrimonio']},
    {label:'Análisis', items:['flujos','simulador','reporting','insights']},
    {label:'Inteligencia', items:['advisor','documentos']},
  ];

  let html = '';
  sections.forEach(sec => {
    html += `<div class="sb-section">${sec.label}</div>`;
    sec.items.forEach(page => {
      const labels = {
        dashboard:'⌂ Dashboard',
        patrimonio:'◇ Patrimonio',
        flujos:'≡ Flujos',
        simulador:'⏣ Simulador',
        reporting:'▤ Reporting',
        insights:'◐ Insights',
        advisor:'✦ Advisor IA',
        documentos:'📄 Documentos',
      };
      html += `<div class="sb-item" onclick="goto('${page}')">${labels[page]}</div>`;
    });
  });

  nav.innerHTML = html;
}

function renderPages() {
  const pages = $('pages');
  const pageNames = ['dashboard','patrimonio','flujos','simulador','reporting','insights','advisor','documentos'];
  
  let html = '';
  pageNames.forEach(p => {
    html += `<div class="page" id="p-${p}"></div>`;
  });

  pages.innerHTML = html;
}

function renderMobileBar() {
  const bar = $('mob-bar');
  if (!bar) return;

  const pages = [
    {id:'dashboard',icon:'⌂',label:'Inicio'},
    {id:'patrimonio',icon:'◇',label:'Patrimonio'},
    {id:'flujos',icon:'≡',label:'Flujos'},
    {id:'advisor',icon:'✦',label:'Advisor'},
  ];

  bar.innerHTML = pages.map(p => `
    <button class="mob-btn" onclick="goto('${p.id}')">
      <div>${p.icon}</div>
      <div>${p.label}</div>
    </button>
  `).join('');
}

function goto(page) {
  $$('.page').forEach(p => p.classList.remove('active'));
  $(`p-${page}`)?.classList.add('active');
  STATE.currentPage = page;

  const labels = {
    dashboard: {t:'Dashboard', s:'Tu patrimonio en un vistazo'},
    patrimonio: {t:'Patrimonio', s:'Todos tus activos'},
    flujos: {t:'Flujos & Gastos', s:'Control de ingresos y gastos'},
    simulador: {t:'Simulador', s:'Proyecta tu futuro'},
    reporting: {t:'Reporting', s:'Informes patrimoniales'},
    insights: {t:'Insights', s:'Análisis inteligente'},
    advisor: {t:'Advisor IA', s:'Tu asesor patrimonial'},
    documentos: {t:'Documentos', s:'Archivo de documentos'},
  };

  const info = labels[page] || {t:'', s:''};
  txt('top-h1', info.t);
  txt('top-sub', info.s);

  renderPageContent(page);
}

function renderPageContent(page) {
  const el = $(`p-${page}`);
  if (!el) return;

  switch(page) {
    case 'dashboard': return renderDashboard(el);
    case 'patrimonio': return renderPatrimonio(el);
    case 'flujos': return renderFlujos(el);
    case 'simulador': return renderSimulator(el);
    case 'advisor': return renderAdvisor(el);
    default: el.innerHTML = `<div class="pc"><p>${page} - Coming soon</p></div>`;
  }
}

/* DASHBOARD */
function renderDashboard(el) {
  const total = STATE.blocks.reduce((s,b) => s+(b.eur_value||0), 0);
  const byType = {};
  STATE.blocks.forEach(b => byType[b.type] = (byType[b.type]||0) + (b.eur_value||0));

  let html = `<div class="pc">`;

  // Hero
  html += `
    <div class="card" style="background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand) 100%);color:white;margin-bottom:24px">
      <div style="font-size:11px;opacity:0.8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Patrimonio Total</div>
      <div style="font-family:var(--mono);font-size:32px;font-weight:600;margin-bottom:12px">${fE(total)}</div>
      <div style="font-size:12px;opacity:0.8">Tu riqueza neta centralizada y sincronizada</div>
    </div>
  `;

  // KPIs
  html += `<div class="kpi-grid k4" style="margin-bottom:24px">`;
  const types = [{key:'cash',label:'Cash',icon:'◇',color:'var(--c-cash)'},{key:'bolsa',label:'Bolsa',icon:'◊',color:'var(--c-bolsa)'},{key:'pe',label:'PE',icon:'◉',color:'var(--c-pe)'},{key:'inmobiliario',label:'Inmobiliario',icon:'◇',color:'var(--c-inmob)'}];

  types.forEach(t => {
    const v = byType[t.key] || 0;
    html += `
      <div class="kpi" onclick="gotoType('${t.key}')" style="cursor:pointer">
        <div class="kpi-stripe" style="background:${t.color}"></div>
        <div class="kpi-l">${t.icon} ${t.label}</div>
        <div class="kpi-v">${fE(v)}</div>
        <div class="kpi-s">${total ? fP((v/total)*100) : '-'}</div>
      </div>
    `;
  });

  html += `</div>`;

  // Chart
  if (STATE.history.length >= 2) {
    html += `
      <div class="card">
        <div class="card-hd">
          <div><div class="card-ti">Evolución Patrimonio (6M)</div></div>
        </div>
        <canvas id="chart-patrimonio" height="200"></canvas>
      </div>
    `;
  }

  html += `</div>`;
  el.innerHTML = html;

  // Draw chart
  if (STATE.history.length >= 2) {
    setTimeout(() => drawPatrimonioChart(), 100);
  }
}

function drawPatrimonioChart() {
  const canvas = $('chart-patrimonio');
  if (!canvas) return;

  if (charts.patrimonio) charts.patrimonio.destroy();

  const labels = STATE.history.map((h,i) => {
    const d = new Date(h.date);
    return d.toLocaleDateString('es-ES', {month:'short', day:'numeric'});
  });
  const data = STATE.history.map(h => h.total);

  charts.patrimonio = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Patrimonio',
        data,
        borderColor: 'var(--brand)',
        backgroundColor: 'rgba(27,79,216,0.05)',
        tension: 0.3,
        fill: true,
        pointRadius: 4,
        pointBackgroundColor: 'var(--brand)',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: false }
      }
    }
  });
}

function gotoType(type) {
  const block = STATE.blocks.find(b => !b.deleted && b.type === type);
  if (block) goto('patrimonio');
  else toast('No tienes activos de este tipo', 'info');
}

/* PATRIMONIO */
function renderPatrimonio(el) {
  const total = STATE.blocks.reduce((s,b) => s+(b.eur_value||0), 0);
  const types = ['cash','bolsa','fondos','pe','inmobiliario','otros'];
  const icons = {cash:'◇',bolsa:'◊',fondos:'◆',pe:'◉',inmobiliario:'◇',otros:'○'};

  let html = `<div class="pc">`;

  types.forEach(type => {
    const blocks = STATE.blocks.filter(b => !b.deleted && b.type === type);
    if (!blocks.length) return;

    const typeTotal = blocks.reduce((s,b) => s+(b.eur_value||0), 0);
    html += `<div class="section-h">${icons[type]} ${type.toUpperCase()}</div>`;

    blocks.forEach(b => {
      const pct = total ? ((b.eur_value||0)/total)*100 : 0;
      html += `
        <div class="card" onclick="viewBlockDetail('${b.id}')" style="cursor:pointer">
          <div class="card-hd">
            <div>
              <div class="card-ti">${esc(b.name)}</div>
              <div class="card-sub">${b.notes || '—'}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:600;color:var(--t-1)">${fE(b.eur_value||b.value||0)}</div>
              <div style="font-size:11px;color:var(--t-3)">${fP(pct)}</div>
            </div>
          </div>
        </div>
      `;
    });
  });

  html += `</div>`;
  el.innerHTML = html;
}

function viewBlockDetail(blockId) {
  const block = STATE.blocks.find(b => b.id === blockId);
  if (!block) return;

  let html = `
    <div style="padding:24px">
      <h2>${esc(block.name)}</h2>
      <p style="color:var(--t-2);margin-bottom:20px">Tipo: <strong>${block.type}</strong></p>

      <div class="kpi-grid k2" style="margin-bottom:24px">
        <div class="kpi">
          <div class="kpi-l">Valor</div>
          <div class="kpi-v">${fE(block.eur_value||block.value||0)}</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">Actualizado</div>
          <div class="kpi-s">${fD(block.updated_at)}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-bd" style="font-size:12px;color:var(--t-2);line-height:1.6">
          <strong>Moneda:</strong> ${block.currency || 'EUR'}<br>
          <strong>Notas:</strong> ${block.notes || '—'}<br>
          <strong>Extra:</strong> ${JSON.stringify(block.extra || {}, null, 2)}
        </div>
      </div>

      <button class="btn btn-primary" onclick="goto('patrimonio')" style="margin-top:18px">Volver</button>
    </div>
  `;

  openModal(html);
}

function openModal(content) {
  const root = $('modal-root');
  root.innerHTML = `<div class="modal">${content}</div>`;
  root.classList.add('open');
}

function closeModal() {
  $('modal-root').classList.remove('open');
}

/* FLUJOS */
function renderFlujos(el) {
  el.innerHTML = `
    <div class="pc">
      <div class="card">
        <div class="card-hd">
          <div><div class="card-ti">Análisis de Gastos</div></div>
          <button class="btn btn-primary btn-xs" onclick="toast('Upload coming soon')">⬆ Subir Excel</button>
        </div>
        <div class="empty" style="padding:40px">

        </div>

  `;

/* SIMULATOR */
function renderSimulator(el) {
  el.innerHTML = `
    <div class="pc">
      <div class="card">
        <div class="card-hd"><div class="card-ti">Simulador Patrimonial</div></div>
        <div class="card-bd" style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
          <div class="field">
            <label class="field-l">Patrimonio actual (€)</label>
            <input class="fi" type="number" id="sim-start" value="31550">
          </div>
          <div class="field">
            <label class="field-l">Aportación mensual (€)</label>
            <input class="fi" type="number" id="sim-monthly" value="500">
          </div>
          <div class="field">
            <label class="field-l">Rentabilidad anual (%)</label>
            <input class="fi" type="number" step="0.1" id="sim-return" value="7">
          </div>
          <div class="field">
            <label class="field-l">Horizonte (años)</label>
            <input class="fi" type="number" id="sim-years" value="20">
          </div>
        </div>
        <button class="btn btn-primary" onclick="runSimulation()" style="margin-top:18px;width:100%;justify-content:center">Simular</button>
      </div>
      <div id="sim-results"></div>
    </div>
  `;
}

function runSimulation() {
  const start = parseFloat(val('sim-start')) || 0;
  const monthly = parseFloat(val('sim-monthly')) || 0;
  const ret = (parseFloat(val('sim-return')) || 7) / 100;
  const years = parseInt(val('sim-years')) || 20;

  const monthlyReturn = Math.pow(1 + ret, 1/12) - 1;
  let balance = start;

  for (let m = 1; m <= years * 12; m++) {
    balance = balance * (1 + monthlyReturn) + monthly;
  }

  const el = $('sim-results');
  el.innerHTML = `
    <div class="card" style="margin-top:18px">
      <div class="card-hd"><div class="card-ti">Resultado</div></div>
      <div class="kpi-grid k2">
        <div class="kpi">
          <div class="kpi-l">Patrimonio en ${years} años</div>
          <div class="kpi-v" style="color:var(--brand)">${fE(Math.round(balance))}</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">Ganancia</div>
          <div class="kpi-v" style="color:var(--pos)">${fE(Math.round(balance - start - (monthly*years*12)))}</div>
        </div>
      </div>
    </div>
  `;
}
