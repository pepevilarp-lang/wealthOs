function handleFile(ev, context) {
  const f = ev.target.files[0];
  if (!f) return;
  handleDroppedFile(f, context);
}

async function handleDroppedFile(file, context) {
  const status = $('up-status');
  if (!status) return;

  if (file.size > 10 * 1024 * 1024) {
    status.innerHTML = '<div class="errmsg">Archivo demasiado grande (máx 10MB)</div>';
    return;
  }

  // Flujos: parse inmediato
  if (context === 'flujos') {
    status.innerHTML = '<div class="okmsg"><span class="dots"><span>·</span><span>·</span><span>·</span></span> Procesando movimientos...</div>';
    parseFlujosExcel(file);
    setTimeout(closeModal, 1200);
    return;
  }

  status.innerHTML = '<div class="okmsg"><span class="dots"><span>·</span><span>·</span><span>·</span></span> Subiendo y analizando...</div>';

  const blockId = uploadBlockId || val('up-block') || null;
  let storagePath = null;
  let summary = '';
  let extracted = {};

  // 1. Subir a storage (si Supabase)
  if (!demo) {
    try {
      const path = `${user.id}/${Date.now()}_${file.name.replace(/[^a-z0-9._-]/gi,'_')}`;
      const { error } = await sb.storage.from('wealth-docs').upload(path, file);
      if (!error) storagePath = path;
    } catch(e) { console.warn('storage upload', e); }
  }

  // 2. Extraer texto según tipo
  let extractedText = '';
  const ext = file.name.split('.').pop().toLowerCase();
  try {
    if (ext === 'pdf') extractedText = await extractPDFText(file);
    else if (['xlsx','xls'].includes(ext)) extractedText = extractXlsxText(file);
    else if (file.type.startsWith('text/')) extractedText = await file.text();
  } catch(e) { console.warn('extract', e); }

  // 3. Si tenemos texto, pedirle a la IA que lo entienda y proponga campos
  if (extractedText && extractedText.length > 100) {
    const aiResult = await analyzeDocumentWithAI(extractedText, blockId, file.name);
    summary = aiResult.summary || '';
    extracted = aiResult.extracted || {};
  }

  // 4. Persistir documento
  const doc = {
    id: gId(), user_id: user?.id, block_id: blockId,
    filename: file.name, doc_type: detectDocType(file.name, extractedText),
    storage_path: storagePath, summary,
    extracted_data: extracted,
    created_at: new Date().toISOString()
  };

  if (!demo) {
    try {
      const { data } = await sb.from('documents').insert({
        user_id: user.id, block_id: blockId,
        filename: file.name, doc_type: doc.doc_type,
        storage_path: storagePath, summary,
        extracted_data: extracted
      }).select().single();
      if (data) doc.id = data.id;
    } catch(e) { console.warn('save doc', e); }
  }

  docs.unshift(doc);

  status.innerHTML = `
    <div class="okmsg" style="margin-top:14px">
      ✓ Documento subido correctamente.
      ${summary ? `<div style="margin-top:6px;font-size:11px;color:var(--t-2)">${esc(summary)}</div>` : ''}
    </div>
    ${Object.keys(extracted).length ? `
      <div class="extract" style="margin-top:14px">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t-3);margin-bottom:8px">Información extraída</div>
        ${Object.entries(extracted).map(([k,v]) => `
          <div class="extract-row"><span class="extract-k">${esc(k)}</span><span class="extract-v">${esc(String(v))}</span></div>
        `).join('')}
        ${blockId ? `<div style="margin-top:10px"><button class="btn btn-primary btn-xs" onclick='applyExtracted(${JSON.stringify(blockId)},${JSON.stringify(extracted)})'>Aplicar al activo</button></div>` : ''}
      </div>
    ` : ''}
  `;

  setTimeout(() => {
    closeModal();
    if (currentPage === 'documentos') renderDocs();
    if (currentPage === 'block-detail' && blockId) renderBlockDetail(blockId);
  }, 2500);
}

async function extractPDFText(file) {
  if (typeof pdfjsLib === 'undefined') return '';
  const arr = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arr}).promise;
  let text = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n\n';
  }
  return text;
}

function extractXlsxText(file) {
  return new Promise((res) => {
    if (typeof XLSX === 'undefined') return res('');
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        let txt = '';
        wb.SheetNames.forEach(n => {
          txt += `=== ${n} ===\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n\n`;
        });
        res(txt);
      } catch { res(''); }
    };
    r.readAsArrayBuffer(file);
  });
}

function detectDocType(filename, text) {
  const f = filename.toLowerCase();
  const t = (text||'').toLowerCase().slice(0, 2000);
  if (/quarterly|trimestral|q[1234].*report/i.test(f) || /capital call|distribution|nav|tvpi/.test(t)) return 'PE Report';
  if (/folleto|prospectus|deck|teaser/.test(f)) return 'Folleto';
  if (/lpa|side.letter/.test(f)) return 'LPA / Side Letter';
  if (/kyc|know.your/.test(f)) return 'KYC';
  if (/extracto|movimient|statement/.test(f) || /saldo|balance/.test(t)) return 'Extracto';
  if (/nomina|nómina|payroll/.test(f)) return 'Nómina';
  if (/factura|invoice|recibo/.test(f)) return 'Factura';
  if (/contrato|contract/.test(f)) return 'Contrato';
  return 'Documento';
}

async function analyzeDocumentWithAI(text, blockId, filename) {
  const block = blockId ? blocks.find(b => b.id === blockId) : null;
  const blockHint = block ? `Este documento está asociado al activo "${block.name}" (${BT[block.type].label}).` : '';
  const truncated = text.slice(0, 12000);

  const prompt = `Eres el extractor de documentos de WealthOS. Analiza este documento y devuelve EXACTAMENTE un JSON con dos campos:

{
  "summary": "Resumen de 1-2 frases sobre qué es este documento y su contenido principal.",
  "extracted": { "campo": "valor", ... }
}

CAMPOS A EXTRAER (solo si aparecen):
- Para reports de Private Equity: NAV, committed, called, distributed, TVPI, DPI, RVPI, IRR, vintage, GP, fecha
- Para extractos bancarios: Saldo, fecha de corte, IBAN parcial
- Para nóminas: Bruto mensual, neto mensual, retenciones, empresa
- Para folletos: Vehículo, gestora, estrategia, target size, geografía

Documento: ${filename}
${blockHint}

CONTENIDO:
"""
${truncated}
"""

Responde SOLO con el JSON, sin texto adicional, sin backticks, sin \`\`\`json.`;

  try {
    const r = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model: AI_MODEL, max_tokens: 800, messages:[{role:'user',content:prompt}]})
    });
    if (!r.ok) throw new Error('api');
    const d = await r.json();
    const txt = d?.content?.[0]?.text || '';
    const cleaned = txt.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    return {
      summary: parsed.summary || '',
      extracted: parsed.extracted || {}
    };
  } catch(e) {
    console.warn('AI doc analysis', e);
    return { summary: 'Documento subido (análisis IA no disponible).', extracted: {} };
  }
}

async function applyExtracted(blockId, extracted) {
  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  const e = b.extra || {};
  let changed = false;
  // Map extracted → block.extra
  const map = {
    'NAV':'__nav','committed':'committed','called':'called','distributed':'distributed',
    'TVPI':'tvpi','DPI':'dpi','RVPI':'rvpi','IRR':'irr',
    'vintage':'vintage','GP':'gp','gestora':'gp','estrategia':'estrategia','geografia':'geografia',
    'Saldo':'__value','saldo':'__value'
  };
  Object.entries(extracted).forEach(([k,v]) => {
    const target = map[k];
    if (!target) return;
    const numeric = typeof v === 'string' ? parseFloat(v.replace(/[^\d.,-]/g,'').replace(',','.')) : v;
    if (target === '__nav' || target === '__value') {
      if (!isNaN(numeric)) { b.value = numeric; b.eur_value = numeric; changed = true; }
    } else if (target === 'gp' || target === 'vintage' || target === 'estrategia' || target === 'geografia') {
      e[target] = String(v); changed = true;
    } else if (!isNaN(numeric)) {
      e[target] = numeric; changed = true;
    }
  });
  if (changed) {
    b.extra = e;
    b.updated_at = new Date().toISOString();
    await saveBlockDB(b);
    await snapshotPatrimonio();
    toast('✓ Información aplicada al activo');
    closeModal();
    renderBlockDetail(blockId);
    renderSidebar();
  } else {
    toast('No se pudo mapear ningún campo','warn');
  }
}
