<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WealthOS — Sistema patrimonial</title>
<meta name="description" content="Tu sistema operativo patrimonial. Entiende, organiza y controla todo tu patrimonio en un solo lugar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1B4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   WealthOS — Premium Wealth Platform
   Paleta: blanco + navy. Tipografía: Fraunces (display) + Inter (sans) + JetBrains Mono (datos)
   Diseño inspirado en Addepar, Masttro, Altoo
   ═══════════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ─── Surfaces ─── */
  --bg:#F4F6FA;
  --bg-elev:#FFFFFF;
  --surf:#FFFFFF;
  --surf-2:#F8FAFC;
  --surf-3:#EEF2F7;
  --surf-4:#E2E8F0;

  /* ─── Lines ─── */
  --line:rgba(15,28,60,.07);
  --line-2:rgba(15,28,60,.04);
  --line-strong:rgba(15,28,60,.14);

  /* ─── Brand: Navy ─── */
  --brand:#1B4FD8;
  --brand-d:#1540B8;
  --brand-l:rgba(27,79,216,.10);
  --brand-bg:rgba(27,79,216,.05);
  --brand-deep:#0F1C3C;

  /* ─── Semantic ─── */
  --pos:#0C9B6A;
  --pos-bg:rgba(12,155,106,.08);
  --pos-d:#08815A;
  --neg:#D93025;
  --neg-bg:rgba(217,48,37,.08);
  --warn:#B45309;
  --warn-bg:rgba(180,83,9,.08);
  --info:#1B4FD8;
  --info-bg:rgba(27,79,216,.08);

  /* ─── Asset-class colors (muted, professional) ─── */
  --c-cash:#0C7B5A;
  --c-bolsa:#1B4FD8;
  --c-fondos:#6B3FA0;
  --c-pe:#B45309;
  --c-inmob:#B03060;
  --c-otros:#4B5563;

  /* ─── Text ─── */
  --t-1:#0F1C3C;
  --t-2:#374151;
  --t-3:#6B7280;
  --t-4:#9CA3AF;
  --t-inv:#FFFFFF;

  /* ─── Typography ─── */
  --display:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

  /* ─── Geometry ─── */
  --r:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-2xl:22px;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);

  /* ─── Shadows ─── */
  --sh-xs:0 1px 2px rgba(15,28,60,.04);
  --sh-sm:0 1px 3px rgba(15,28,60,.06),0 1px 2px rgba(15,28,60,.04);
  --sh-md:0 4px 12px rgba(15,28,60,.08),0 2px 4px rgba(15,28,60,.05);
  --sh-lg:0 12px 32px rgba(15,28,60,.10),0 4px 8px rgba(15,28,60,.06);
  --sh-xl:0 24px 48px rgba(15,28,60,.14),0 8px 16px rgba(15,28,60,.08);

  /* ─── Motion ─── */
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.0,0,.2,1);
}

html,body{
  height:100%; background:var(--bg); color:var(--t-1);
  font-family:var(--sans); font-size:13px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow:hidden; text-rendering:optimizeLegibility;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t-4)}
::-webkit-scrollbar-track{background:transparent}

button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--brand);text-decoration:none}

/* ════════════ APP LAYOUT ════════════ */
.app{display:flex;height:100vh;overflow:hidden}

/* ════════════ SIDEBAR (DARK NAVY) ════════════ */
.sb{
  width:248px; flex-shrink:0; background:var(--brand-deep);
  display:flex; flex-direction:column; overflow:hidden;
  padding-top:var(--safe-t);
}
.sb-brand{
  padding:22px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:11px; flex-shrink:0;
}
.sb-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:16px;font-weight:600;color:#fff;
  letter-spacing:-.5px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(27,79,216,.4);
}
.sb-name{
  font-family:var(--display);font-size:17px;font-weight:500;
  letter-spacing:-.3px;color:#fff;line-height:1;
}
.sb-name-sub{
  font-size:9px;font-weight:600;color:rgba(255,255,255,.4);
  text-transform:uppercase;letter-spacing:1.2px;margin-top:3px;
}
.sb-scroll{flex:1;overflow-y:auto;padding:14px 10px}
.sb-group{margin-bottom:6px}
.sb-label{
  font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:1.2px;color:rgba(255,255,255,.32);
  padding:14px 10px 8px;
}
.ni{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:7px;
  font-size:12.5px;font-weight:400;
  color:rgba(255,255,255,.6);
  cursor:pointer;border:none;background:none;
  width:100%;text-align:left;
  transition:all .15s var(--ease);
  letter-spacing:-.1px;
}
.ni:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.ni.active{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
  color:#fff;font-weight:500;
  box-shadow:0 2px 8px rgba(27,79,216,.35);
}
.ni-ic{width:14px;flex-shrink:0;opacity:.75;font-size:12px;text-align:center}
.ni.active .ni-ic{opacity:1}
.ni-meta{
  margin-left:auto;font-size:10px;font-family:var(--mono);
  color:rgba(255,255,255,.32);font-weight:500;
}
.ni.active .ni-meta{color:rgba(255,255,255,.85)}
.sb-block{
  margin-left:14px;border-left:1px solid rgba(255,255,255,.08);
  padding-left:6px;margin-bottom:2px;
}
.sb-block .ni{padding:6px 9px;font-size:11.5px;color:rgba(255,255,255,.42)}
.sb-block .ni-ic{font-size:9px;width:8px}
.sb-foot{
  border-top:1px solid rgba(255,255,255,.08);
  padding:10px;flex-shrink:0;
}
.sb-user{
  display:flex;align-items:center;gap:11px;padding:7px;
  cursor:pointer;border-radius:7px;
  transition:background .14s var(--ease);
}
.sb-user:hover{background:rgba(255,255,255,.06)}
.sb-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#fff;flex-shrink:0;
  font-family:var(--display);letter-spacing:-.5px;
}
.sb-uname{font-size:12px;font-weight:500;color:#fff;line-height:1.2}
.sb-uemail{font-size:10px;color:rgba(255,255,255,.42);margin-top:2px}
#user-menu{
  background:rgba(255,255,255,.06);border-radius:7px;padding:6px;
  margin-top:6px;
}
#user-menu .ni{font-size:11.5px;padding:7px 10px}

/* ════════════ MAIN AREA ════════════ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}

.top{
  height:60px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 28px;border-bottom:1px solid var(--line);
  gap:14px;background:var(--surf);box-shadow:var(--sh-xs);
}
.top-h-wrap{flex:1;min-width:0}
.top-h1{
  font-family:var(--display);font-size:18px;font-weight:500;
  letter-spacing:-.4px;color:var(--t-1);line-height:1.1;
}
.top-sub{font-size:11px;color:var(--t-3);font-weight:400;margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}

/* ════════════ BUTTONS ════════════ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:7px;
  font-family:var(--sans);font-size:12px;font-weight:500;
  cursor:pointer;border:1px solid transparent;
  transition:all .14s var(--ease);letter-spacing:-.1px;
  white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);
  color:#fff;border-color:var(--brand-d);
  box-shadow:0 1px 2px rgba(27,79,216,.2);
}
.btn-primary:hover{
  background:linear-gradient(135deg,var(--brand-d) 0%,#0F2E8B 100%);
  box-shadow:0 4px 12px rgba(27,79,216,.3);
  transform:translateY(-1px);
}
.btn-ghost{background:transparent;color:var(--t-2);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surf-2);color:var(--t-1);border-color:var(--brand)}
.btn-soft{background:var(--surf-2);color:var(--t-1);border-color:var(--line)}
.btn-soft:hover{background:var(--surf-3)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn-xs{padding:4px 9px;font-size:10.5px;border-radius:5px}
.btn-danger{background:var(--neg-bg);color:var(--neg);border-color:rgba(217,48,37,.18)}
.btn-danger:hover{background:rgba(217,48,37,.12)}
.btn-icon{padding:7px;border-radius:7px;background:var(--surf-2);border:1px solid var(--line);color:var(--t-2)}
.btn-icon:hover{background:var(--surf-3);color:var(--t-1)}

/* ════════════ PAGES ════════════ */
.pages{flex:1;overflow:hidden;position:relative}
.page{display:none;height:100%;overflow-y:auto}
.page.active{display:block;animation:fadePage .25s var(--ease-out)}
@keyframes fadePage{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.pc{padding:28px 32px;max-width:1320px}

/* ════════════ CARDS ════════════ */
.card{
  background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-sm);
}
.card-hd{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card-ti{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.7px;color:var(--t-3);
}
.card-bd{padding:18px}

/* ════════════ HERO PATRIMONIAL ════════════ */
.hero{
  background:
    radial-gradient(circle at 20% 30%, rgba(27,79,216,.18), transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(99,102,241,.12), transparent 50%),
    linear-gradient(135deg,var(--brand-deep) 0%,#162E5F 100%);
  border-radius:var(--r-xl);padding:32px 36px;margin-bottom:20px;
  position:relative;overflow:hidden;
  box-shadow:var(--sh-lg);
}
.hero::before{
  content:'';position:absolute;top:-80px;right:-80px;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);
  pointer-events:none;
}
.hero-row-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;margin-bottom:14px;flex-wrap:wrap;
}
.hero-label{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:1.2px;color:rgba(255,255,255,.55);
  display:flex;align-items:center;gap:9px;
}
.hero-label::before{content:'';width:14px;height:1px;background:rgba(255,255,255,.4)}
.hero-period-pill{
  display:inline-flex;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:7px;
  padding:3px;
}
.hero-period-pill button{
  background:transparent;border:none;color:rgba(255,255,255,.6);
  font-size:11px;font-weight:500;padding:5px 10px;
  border-radius:5px;cursor:pointer;transition:all .14s var(--ease);
}
.hero-period-pill button.active{background:rgba(255,255,255,.15);color:#fff}
.hero-val{
  font-family:var(--display);font-size:54px;font-weight:400;
  letter-spacing:-1.8px;color:#fff;line-height:1;margin-bottom:12px;
}
.hero-val-sup{
  font-size:18px;color:rgba(255,255,255,.6);font-weight:300;
  letter-spacing:0;margin-left:8px;
}
.hero-stats{
  display:flex;gap:32px;flex-wrap:wrap;margin-top:16px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.1);
}
.hero-stat{display:flex;flex-direction:column;gap:3px}
.hero-stat-l{
  font-size:10px;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:.7px;font-weight:500;
}
.hero-stat-v{
  font-size:14.5px;font-weight:500;font-family:var(--mono);color:#fff;
}
.up{color:var(--pos)}.dn{color:var(--neg)}.am{color:var(--warn)}
.up-light{color:#7FE0BC}.dn-light{color:#FCA5A5}

/* ════════════ KPI ════════════ */
.kpi-grid{display:grid;gap:14px;margin-bottom:20px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.kpi{
  background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 20px;
  position:relative;overflow:hidden;box-shadow:var(--sh-xs);
  transition:all .18s var(--ease);
}
.kpi:hover{border-color:var(--brand);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.kpi-stripe{position:absolute;top:0;left:0;width:3px;height:100%}
.kpi-l{
  font-size:10px;color:var(--t-3);text-transform:uppercase;
  letter-spacing:.7px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.kpi-v{
  font-family:var(--display);font-size:26px;font-weight:500;
  letter-spacing:-.7px;line-height:1.05;color:var(--t-1);
}
.kpi-v-mono{
  font-family:var(--mono);font-size:18px;font-weight:500;
  letter-spacing:-.5px;
}
.kpi-s{font-size:10.5px;color:var(--t-3);margin-top:8px;font-weight:400}

/* ════════════ BLOCK CARDS ════════════ */
.bgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:14px;
}
.bcard{
  background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:0;cursor:pointer;
  transition:all .2s var(--ease);overflow:hidden;
  box-shadow:var(--sh-xs);position:relative;
}
.bcard:hover{
  border-color:var(--brand);box-shadow:var(--sh-md);
  transform:translateY(-2px);
}
.bcard-stripe{height:3px;width:100%}
.bcard-bd{padding:18px 20px}
.bcard-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bcard-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
}
.bcard-pct{
  font-family:var(--mono);font-size:11px;color:var(--t-3);
  font-weight:500;background:var(--surf-2);
  padding:3px 8px;border-radius:5px;
}
.bcard-name{
  font-size:14px;font-weight:600;color:var(--t-1);
  margin-bottom:3px;letter-spacing:-.1px;
}
.bcard-sub{
  font-size:11.5px;color:var(--t-3);margin-bottom:14px;
  line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:32px;
}
.bcard-val{
  font-family:var(--display);font-size:24px;font-weight:500;
  letter-spacing:-.6px;color:var(--t-1);line-height:1;
}
.bcard-meta{
  font-size:10.5px;color:var(--t-4);margin-top:8px;
  font-weight:400;display:flex;align-items:center;gap:8px;
}
.bcard-add{
  border:1.5px dashed var(--line-strong);background:transparent;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;min-height:178px;padding:24px;
  cursor:pointer;border-radius:var(--r-lg);box-shadow:none;
  transition:all .18s var(--ease);
}
.bcard-add:hover{border-color:var(--brand);background:var(--brand-bg)}
.bcard-add-ic{font-size:26px;color:var(--t-3);font-weight:300}
.bcard-add-t{font-size:12px;color:var(--t-3);font-weight:500}

/* ════════════ DETAIL PAGE ════════════ */
.detail-h{display:flex;align-items:flex-start;gap:18px;margin-bottom:26px}
.detail-icon{
  width:56px;height:56px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
}
.detail-info{flex:1;min-width:0}
.detail-name{
  font-family:var(--display);font-size:26px;font-weight:500;
  letter-spacing:-.7px;color:var(--t-1);line-height:1.1;
}
.detail-sub{
  font-size:12px;color:var(--t-3);margin-top:6px;
  display:flex;flex-wrap:wrap;gap:14px;
}
.detail-sub span{display:flex;align-items:center;gap:5px}
.detail-acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}

/* ════════════ TABLE ════════════ */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.7px;color:var(--t-3);padding:11px 14px;
  border-bottom:1px solid var(--line);text-align:left;
  background:var(--surf-2);
}
.tbl td{
  padding:13px 14px;border-bottom:1px solid var(--line-2);
  font-size:12px;color:var(--t-2);vertical-align:middle;
}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .12s var(--ease)}
.tbl tbody tr:hover td{background:var(--brand-bg);color:var(--t-1)}
.r{text-align:right}.c{text-align:center}
.mono{font-family:var(--mono);font-weight:500}

/* ════════════ PE — multiples & cap stack ════════════ */
.pe-multiples{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;
}
.multi{
  background:var(--surf-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:16px;text-align:center;
  transition:border-color .14s var(--ease);
}
.multi:hover{border-color:var(--line-strong)}
.multi-v{
  font-family:var(--display);font-size:24px;font-weight:500;
  letter-spacing:-.6px;line-height:1;
}
.multi-l{
  font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:.7px;color:var(--t-3);margin-top:8px;
}
.multi-s{font-size:9.5px;color:var(--t-4);margin-top:3px}

.cap-bar{
  display:flex;height:30px;border-radius:7px;overflow:hidden;
  margin:14px 0 10px;background:var(--surf-2);
}
.cap-seg{
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:#fff;
  transition:flex .35s var(--ease);
}
.cap-called{background:linear-gradient(90deg,#1B4FD8 0%,#1540B8 100%)}
.cap-pending{background:var(--surf-3);color:var(--t-3)}
.cap-distributed{background:linear-gradient(90deg,#0C7B5A 0%,#0C9B6A 100%)}
.cap-stats{
  display:flex;justify-content:space-between;
  font-size:10.5px;font-weight:500;color:var(--t-3);
}
.cap-stat-v{
  font-family:var(--mono);color:var(--t-1);margin-left:5px;font-weight:500;
}

/* ════════════ TRANSACTIONS ════════════ */
.tx-item{
  display:flex;align-items:center;gap:14px;padding:13px 18px;
  border-bottom:1px solid var(--line-2);
}
.tx-item:last-child{border-bottom:none}
.tx-icon{
  width:34px;height:34px;border-radius:9px;

  font-size:14px;flex-shrink:0;font-weight:600;
}
.tx-icon-call{background:var(--neg-bg);color:var(--neg)}
.tx-icon-dist{background:var(--pos-bg);color:var(--pos)}
.tx-icon-pending{background:var(--warn-bg);color:var(--warn)}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:12.5px;font-weight:500;color:var(--t-1)}
.tx-meta{font-size:10.5px;color:var(--t-3);margin-top:2px}
.tx-amount{
  font-family:var(--mono);font-size:13px;font-weight:500;text-align:right;
}

/* ════════════ MODAL ════════════ */
.overlay{
  position:fixed;inset:0;background:rgba(10,20,50,.40);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:1000;display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s var(--ease);
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surf);border-top:1px solid var(--line);
  width:100%;max-width:540px;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .28s var(--ease-out);box-shadow:var(--sh-xl);
}
@media(min-width:640px){
  .modal{border:1px solid var(--line);border-radius:var(--r-xl)}
}
.modal-lg{max-width:720px}
.modal-xl{max-width:920px}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{
  padding:18px 22px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.mh-t{
  font-family:var(--display);font-size:18px;font-weight:500;
  letter-spacing:-.3px;color:var(--t-1);
}
.mh-c{
  background:none;border:none;color:var(--t-3);
  font-size:20px;cursor:pointer;padding:6px;line-height:1;
  border-radius:5px;transition:all .12s var(--ease);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
}

.mb{padding:22px;overflow-y:auto;flex:1}
.mf{
  padding:14px 22px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;
  padding-bottom:calc(14px + var(--safe-b));
}

/* ════════════ FORM ════════════ */
.field{margin-bottom:16px}
.field-l{
  display:block;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.7px;
  color:var(--t-3);margin-bottom:6px;
}
.fi,.fs,.ft{
  width:100%;padding:10px 13px;background:var(--surf);
  border:1px solid var(--line-strong);border-radius:8px;
  font-family:var(--sans);font-size:13px;color:var(--t-1);
  outline:none;transition:all .14s var(--ease);
}
.fi:focus,.fs:focus,.ft:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(27,79,216,.10);
}
.fi::placeholder,.ft::placeholder{color:var(--t-4)}
.fs{
  cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='%236B7280'><path d='M6 8L2 4h8z'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;
}
.ft{resize:vertical;min-height:80px;font-family:var(--sans);line-height:1.5}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:10.5px;color:var(--t-4);margin-top:5px;line-height:1.5}
.errmsg{
  font-size:11.5px;color:var(--neg);background:var(--neg-bg);
  border:1px solid rgba(217,48,37,.15);border-radius:7px;
  padding:10px 13px;margin-bottom:14px;
}
.okmsg{
  font-size:11.5px;color:var(--pos-d);background:var(--pos-bg);
  border:1px solid rgba(12,155,106,.15);border-radius:7px;
  padding:10px 13px;margin-bottom:14px;
}
.warnmsg{
  font-size:11.5px;color:var(--warn);background:var(--warn-bg);
  border:1px solid rgba(180,83,9,.15);border-radius:7px;
  padding:10px 13px;margin-bottom:14px;
}

/* ════════════ UPLOAD ════════════ */
.upz{
  border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);
  padding:34px;text-align:center;cursor:pointer;

}
.upz:hover,.upz.drag{border-color:var(--brand);background:var(--brand-bg)}
.upz-ic{font-size:32px;margin-bottom:10px;opacity:.4}
.upz-t{font-size:13px;font-weight:500;color:var(--t-1);margin-bottom:4px}

/* ════════════ DOC LIST ════════════ */
.doc{

}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:12.5px;font-weight:500;color:var(--t-1);margin-bottom:2px}
.doc-meta{font-size:10.5px;color:var(--t-3)}
.doc-summary{font-size:11px;color:var(--t-2);margin-top:6px;line-height:1.5}

/* ════════════ EXTRACT ════════════ */
.extract{

}

/* ════════════ CHAT ════════════ */
.chat{display:flex;flex-direction:column;height:100%;background:var(--bg)}

  flex:1;overflow-y:auto;padding:24px 32px;

}
.msg{display:flex;gap:11px;align-items:flex-start;max-width:84%}
.msg-ai{align-self:flex-start}
.msg-u{align-self:flex-end;flex-direction:row-reverse}
.msg-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;

  font-family:var(--display);letter-spacing:-.5px;
}

}

}

  background:var(--surf-2);border:1px solid var(--line);

}

.chat-in-row{
  padding:14px 32px;border-top:1px solid var(--line);

  padding-bottom:calc(14px + var(--safe-b));background:var(--surf);
  align-items:flex-end;
}
.chat-in{
  flex:1;background:var(--surf-2);
  border:1px solid var(--line-strong);border-radius:11px;
  padding:11px 14px;font-family:var(--sans);font-size:13px;
  color:var(--t-1);outline:none;resize:none;
  min-height:44px;max-height:140px;
  transition:border-color .14s var(--ease);line-height:1.5;
}
.chat-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,79,216,.08)}
.dots span{display:inline-block;animation:dotB 1.3s infinite;opacity:.4;font-size:14px}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes dotB{0%,80%,100%{transform:scale(.7);opacity:.3}40%{transform:scale(1);opacity:1}}

/* ════════════ AUTH ════════════ */
.auth{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#EEF2F7 0%,#F0F4F8 50%,#E2E8F0 100%);
  z-index:9000;display:flex;align-items:center;justify-content:center;padding:24px;
}
.auth-card{width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:36px}

  width:64px;height:64px;border-radius:15px;

  margin:0 auto 18px;
  font-family:var(--display);font-size:28px;font-weight:500;
  color:#fff;letter-spacing:-1.5px;
  box-shadow:0 12px 32px rgba(15,28,60,.18);
}
.auth-name{
  font-family:var(--display);font-size:32px;font-weight:400;
  letter-spacing:-1px;color:var(--t-1);
}

  font-size:11px;color:var(--t-3);margin-top:5px;

}

  background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:30px;box-shadow:var(--sh-xl);
}
.auth-tabs{
  display:flex;background:var(--surf-2);border-radius:9px;
  padding:3px;margin-bottom:22px;
}
.atab{
  flex:1;padding:9px;border:none;border-radius:7px;
  background:transparent;font-family:var(--sans);
  font-size:12px;font-weight:500;cursor:pointer;
  color:var(--t-3);transition:all .14s var(--ease);
  letter-spacing:-.1px;
}
.atab.active{background:var(--surf);color:var(--t-1);box-shadow:var(--sh-sm)}
.auth-div{
  display:flex;align-items:center;gap:10px;margin:18px 0;
  color:var(--t-4);font-size:10px;text-transform:uppercase;
  letter-spacing:1px;font-weight:500;
}
.auth-div::before,.auth-div::after{content:'';flex:1;height:1px;background:var(--line)}
.auth-google{
  width:100%;padding:11px;background:var(--surf-2);
  border:1px solid var(--line);border-radius:9px;
  font-family:var(--sans);font-size:12.5px;color:var(--t-1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:all .14s var(--ease);font-weight:500;
}
.auth-google:hover{background:var(--surf-3);border-color:var(--line-strong)}
.auth-demo{text-align:center;margin-top:18px}
.auth-demo button{
  background:none;border:none;color:var(--t-3);
  font-family:var(--sans);font-size:11.5px;cursor:pointer;
  text-decoration:underline;letter-spacing:-.05px;font-weight:500;
}
.auth-demo button:hover{color:var(--brand)}

/* ════════════ ONBOARDING ════════════ */
.onb{
  position:fixed;inset:0;background:var(--bg);
  z-index:8000;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto;
}
.onb-card{
  width:100%;max-width:580px;background:var(--surf);

}
.onb-step{
  font-size:10px;font-weight:600;color:var(--brand);
  text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px;
}
.onb-title{
  font-family:var(--display);font-size:28px;font-weight:500;
  letter-spacing:-.8px;color:var(--t-1);margin-bottom:10px;line-height:1.15;
}
.onb-sub{
  font-size:13.5px;color:var(--t-2);margin-bottom:28px;
  line-height:1.65;font-weight:400;
}
.onb-prog{display:flex;gap:5px;margin-bottom:28px}
.onb-dot{
  height:3px;border-radius:2px;background:var(--line-strong);
  flex:1;transition:background .3s var(--ease);
}
.onb-dot.done{background:var(--brand)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.opt{
  padding:15px;background:var(--surf-2);border:1px solid var(--line);
  border-radius:11px;font-family:var(--sans);font-size:12.5px;
  color:var(--t-2);cursor:pointer;text-align:left;
  transition:all .14s var(--ease);display:flex;align-items:center;gap:11px;
}
.opt:hover{border-color:var(--line-strong);color:var(--t-1)}
.opt.sel{border-color:var(--brand);background:var(--brand-bg);color:var(--brand)}
.opt-ic{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.opt-t{font-weight:500;font-size:12.5px;letter-spacing:-.1px}
.opt-s{font-size:10.5px;color:var(--t-3);margin-top:2px}
.opt.sel .opt-s{color:var(--brand-d)}

/* ════════════ TOASTS ════════════ */
.toasts{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;max-width:340px;
}
.toast{
  background:var(--brand-deep);border-radius:10px;
  padding:13px 17px;font-size:12px;
  animation:slideR .22s var(--ease-out);
  box-shadow:var(--sh-xl);color:#fff;
  display:flex;align-items:center;gap:10px;
}
@keyframes slideR{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ════════════ MISC ════════════ */
.section-h{
  font-size:11px;font-weight:600;color:var(--t-3);
  text-transform:uppercase;letter-spacing:.8px;
  margin:24px 0 14px;padding-bottom:10px;

}

.tag-neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(217,48,37,.18)}
.tag-warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(180,83,9,.18)}
.tag-info{background:var(--info-bg);color:var(--info);border-color:rgba(27,79,216,.18)}

.empty{text-align:center;padding:48px 24px;color:var(--t-4)}
.empty-ic{font-size:36px;margin-bottom:14px;opacity:.3}
.empty-t{font-size:13.5px;font-weight:500;color:var(--t-2);margin-bottom:6px}

  }

    flex:1;display:flex;flex-direction:column;align-items:center;

}

     AUTH SCREEN

<div class="auth" id="auth">

    });
    boot();

async function doAuth() {
  const mode = $('a-btn').dataset.mode || 'in';
  const email = val('a-email').trim();
  const pass = val('a-pass');
  const name = val('a-name').trim();

  if (!email || !pass) return showAuthMsg('err','Email y contraseña son obligatorios');
  if (mode === 'up' && pass.length < 6) return showAuthMsg('err','Mínimo 6 caracteres');

  $('a-btn').disabled = true;
  $('a-btn').textContent = 'Procesando...';

  try {
    if (mode === 'up') {
      const { data, error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name || email.split('@')[0] } }
      });
      if (error) throw error;
      if (data.user && !data.session) {
        showAuthMsg('ok','Revisa tu email para confirmar la cuenta.');
        $('a-btn').disabled = false;
        $('a-btn').textContent = 'Crear cuenta →';
        return;
      }
      user = data.user;
      await loadAll();
      await checkOnboarding();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      user = data.user;
      await loadAll();
      await checkOnboarding();
    }
  } catch(e) {
    console.error(e);
    showAuthMsg('err', e.message || 'Error de autenticación');
    $('a-btn').disabled = false;
    $('a-btn').textContent = mode==='in' ? 'Entrar →' : 'Crear cuenta →';
  }
}

    const { data, error } = await query;

}

  $('onb-card').innerHTML = `
    <div class="onb-step">${s.label}</div>

      ${onbStep>1?'<button class="btn btn-ghost" onclick="onbBack()">← Atrás</button>':''}
      ${onbStep===ONB_TOTAL?'<button class="btn btn-ghost" onclick="onbSkip()">Saltar</button>':''}
      <button class="btn btn-primary" onclick="onbNext()">${onbStep<ONB_TOTAL?'Continuar →':'Empezar →'}</button>
    </div>
  `;
}

function onbSel(k,v,btn) {
  onbData[k] = v;
  btn.closest('.opt-grid').querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function onbToggle(k,btn) {
  if (!onbData.types) onbData.types = [];
  const i = onbData.types.indexOf(k);
  if (i >= 0) { onbData.types.splice(i,1); btn.classList.remove('sel'); }
  else { onbData.types.push(k); btn.classList.add('sel'); }
}

function onbBack() { if (onbStep>1) { onbStep--; renderOnb(); } }

async function onbNext() {
  if (onbStep === 3) {
    onbData.patrimonio = val('onb-pat');
    onbData.horizon = val('onb-hor');
    onbData.goal = val('onb-goal');
  }
  if (onbStep === 4) {
    onbData.income = parseFloat(val('onb-income')||'0') || null;
    onbData.expense = parseFloat(val('onb-expense')||'0') || null;
  }
  if (onbStep === ONB_TOTAL) {
    const bn = val('onb-bn'), bv = parseFloat(val('onb-bv')||'0');
    if (bn) {
      const b = {
        id: gId(), type: 'cash', name: bn, value: bv,
        eur_value: bv, currency: 'EUR', notes: '', extra: {remunerada:false},
        created_at: new Date().toISOString(), updated_at: new Date().toISOString()
      };
      blocks.push(b);
      await saveBlockDB(b);
    }
    await saveProfile({
      risk_profile: onbData.profile||'moderate',
      investment_horizon: onbData.horizon||'medium',
      goal: onbData.goal||'growth',
      monthly_income: onbData.income,
      monthly_expense: onbData.expense,
      onboarding_completed: true
    });
    await snapshotPatrimonio();
    showApp();
    return;
  }
  onbStep++;
  renderOnb();
}

async function onbSkip() {
  await saveProfile({onboarding_completed: true});
  showApp();
}

// ─── 6. NAVIGATION & SIDEBAR ─────────────────────────────────────────────
function showApp() {
  $('auth').style.display = 'none';
  $('onb').style.display = 'none';
  $('app').style.display = 'flex';

  const name = user?.user_metadata?.full_name || user?.email?.split('@')[0] || (demo?'Demo':'Usuario');
  setText('sb-uname', name);
  setText('sb-uemail', demo ? 'modo demo' : (user?.email || ''));
  setText('sb-av', name.charAt(0).toUpperCase());

  renderSidebar();
  renderPagesShells();
  goto('dashboard');
}

function renderPagesShells() {
  // Crear contenedores de páginas (vacíos al principio, se rellenan al navegar)
  $('pages').innerHTML = `
    <div class="page" id="p-dashboard"></div>
    <div class="page" id="p-patrimonio"></div>
    <div class="page" id="p-flujos"></div>
    <div class="page" id="p-documentos"></div>
    <div class="page" id="p-reporting"></div>
    <div class="page" id="p-insights"></div>
    <div class="page" id="p-advisor"></div>
    <div class="page" id="p-block-detail"></div>
  `;
}

function renderSidebar() {
  const sections = [
    {label:'Principal', items:[
      {key:'dashboard',  ic:'⌂', label:'Dashboard'},
      {key:'patrimonio', ic:'◇', label:'Patrimonio', meta: blocks.filter(b=>!b.deleted).length || ''},
    ]},
    {label:'Análisis', items:[
      {key:'flujos',     ic:'≡', label:'Flujos & gastos'},
      {key:'reporting',  ic:'▤', label:'Reporting'},
      {key:'insights',   ic:'◐', label:'Insights'},
    ]},
    {label:'Inteligencia', items:[
      {key:'advisor',    ic:'✦', label:'Advisor IA'},
      {key:'documentos', ic:'▣', label:'Documentos', meta: docs.length || ''},
    ]},
  ];

  let html = sections.map(sec => `
    <div class="sb-group">
      <div class="sb-label">${sec.label}</div>
      ${sec.items.map(it => `
        <button class="ni ${currentPage===it.key?'active':''}" onclick="goto('${it.key}',this)">
          <span class="ni-ic">${it.ic}</span>
          ${it.label}
          ${it.meta ? `<span class="ni-meta">${it.meta}</span>` : ''}
        </button>
      `).join('')}
    </div>
  `).join('');

  // Sección dinámica con bloques agrupados
  const grouped = {};
  blocks.filter(b=>!b.deleted).forEach(b => {
    if (!grouped[b.type]) grouped[b.type] = [];
    grouped[b.type].push(b);
  });

  if (Object.keys(grouped).length > 0) {
    html += `<div class="sb-group"><div class="sb-label">Activos</div>`;
    Object.entries(grouped).forEach(([type,arr]) => {
      const cfg = BT[type];
      html += `<button class="ni" onclick="goto('patrimonio')">
        <span class="ni-ic" style="color:${cfg.color}">${cfg.ic}</span>
        ${cfg.label}
        <span class="ni-meta">${arr.length}</span>
      </button>
      <div class="sb-block">`;
      arr.forEach(b => {
        html += `<button class="ni" onclick="gotoBlock('${b.id}')">
          <span class="ni-ic">·</span>
          ${esc(b.name)}
        </button>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  $('sb-scroll').innerHTML = html;
}

function goto(page, el) {
  currentPage = page;
  $$('.page').forEach(p => p.classList.remove('active'));
  const target = $('p-' + page);
  if (target) target.classList.add('active');

  const meta = PAGE_TITLES[page];
  if (meta) {
    setText('top-h1', meta.t);
    setText('top-sub', meta.s);
    setText('mob-title', meta.t);
  }

  // Render dinámico según la página
  if (page === 'dashboard')   renderDash();
  if (page === 'patrimonio')  renderPatr();
  if (page === 'flujos')      renderFlujos();
  if (page === 'documentos')  renderDocs();
  if (page === 'reporting')   renderReporting();
  if (page === 'insights')    renderInsights();
  if (page === 'advisor')     renderAdvisor();

  renderSidebar();
}

function gotoBlock(blockId) {
  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  currentPage = 'block-detail';
  $$('.page').forEach(p => p.classList.remove('active'));
  $('p-block-detail').classList.add('active');
  setText('top-h1', b.name);
  setText('top-sub', BT[b.type].label + ' · ' + fE(b.eur_value||b.value||0));
  setText('mob-title', b.name);
  renderBlockDetail(blockId);
  renderSidebar();
}

function gotoTypeOrBlock(type) {
  // Si hay exactamente 1 bloque de este tipo → ir directo al detalle
  // Si hay varios → ir a patrimonio (se ve la sección del tipo)
  // Si no hay ninguno → abrir modal de añadir con ese tipo preseleccionado
  const ofType = blocks.filter(b => !b.deleted && b.type === type);
  // Para bolsa+fondos, considerar ambos
  const combined = (type === 'bolsa')
    ? blocks.filter(b => !b.deleted && (b.type === 'bolsa' || b.type === 'fondos'))
    : ofType;

  if (combined.length === 1) {
    gotoBlock(combined[0].id);
  } else if (combined.length > 1) {
    goto('patrimonio');
    // Scroll al tipo correcto tras renderizar
    setTimeout(() => {
      const headers = document.querySelectorAll('.section-h');
      const label = BT[type]?.label;
      headers.forEach(h => { if (h.textContent.includes(label)) h.scrollIntoView({behavior:'smooth', block:'start'}); });
    }, 100);
  } else {
    openAddBlock(type);
  }
}

// ─── 7. DASHBOARD ────────────────────────────────────────────────────────
function renderDash() {
  const p = $('p-dashboard');

  const byType = {};

    byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0);
  });

  // Cálculo evolución (vs 30 días atrás)
  let delta30 = null, delta30Pct = null;
  if (history.length >= 2) {
    const today = new Date(); const ref = new Date(today); ref.setDate(ref.getDate()-30);
    const past = [...history].reverse().find(h => new Date(h.date) <= ref);
    if (past) {
      delta30 = t - past.total;
      delta30Pct = past.total ? (delta30/past.total)*100 : 0;
    }

  // Cash improductivo (cash no remunerado)
  const cashNoRem = blocks.filter(b=>!b.deleted && b.type==='cash' && !b.extra?.remunerada)

  const liquidPct = t ? (cashTot/t)*100 : 0;

  // PE compromisos pendientes
  const peBlocks = blocks.filter(b=>!b.deleted && b.type==='pe');
  const totalCommitted = peBlocks.reduce((s,b)=>s+(b.extra?.committed||0),0);
  const totalCalled = peBlocks.reduce((s,b)=>s+(b.extra?.called||0),0);
  const unfunded = totalCommitted - totalCalled;

  p.innerHTML = `
    <div class="pc">
      <!-- HERO -->

        <div class="hero-row-top">
          <div class="hero-label">Patrimonio total</div>
          <div class="hero-period-pill">

            <button>3M</button>
            <button>1Y</button>
            <button>YTD</button>

        </div>

        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-l">vs 30 días</div>
            <div class="hero-stat-v ${delta30>=0?'up-light':'dn-light'}">
              ${delta30 !== null ? (delta30>=0?'+':'') + fE(delta30) + (delta30Pct!==null?` (${delta30Pct>=0?'+':''}${delta30Pct.toFixed(2)}%)`:'') : '—'}
            </div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-l">Activos</div>
            <div class="hero-stat-v">${blocks.filter(b=>!b.deleted).length}</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-l">Líquido</div>
            <div class="hero-stat-v">${fP(liquidPct)}</div>
          </div>
          ${unfunded > 0 ? `
          <div class="hero-stat">
            <div class="hero-stat-l">Comprometido pendiente</div>
            <div class="hero-stat-v am">${fE(unfunded)}</div>
          </div>` : ''}
        </div>
      </div>

      <!-- KPIs — clicables: llevan al bloque o sección -->
      <div class="kpi-grid k4">
        <div class="kpi" style="cursor:pointer" onclick="gotoTypeOrBlock('cash')"><div class="kpi-stripe" style="background:var(--c-cash)"></div>
          <div class="kpi-l">◇ Cash</div>
          <div class="kpi-v">${fE(byType.cash||0)}</div>
          <div class="kpi-s">${cashNoRem ? `${fE(cashNoRem)} sin remunerar` : blocks.filter(b=>!b.deleted&&b.type==='cash').length+' cuentas'}</div>
        </div>
        <div class="kpi" style="cursor:pointer" onclick="gotoTypeOrBlock('bolsa')"><div class="kpi-stripe" style="background:var(--c-bolsa)"></div>
          <div class="kpi-l">◊ Bolsa + Fondos</div>
          <div class="kpi-v">${fE((byType.bolsa||0)+(byType.fondos||0))}</div>
          <div class="kpi-s">${blocks.filter(b=>!b.deleted&&(b.type==='bolsa'||b.type==='fondos')).length} posiciones</div>
        </div>
        <div class="kpi" style="cursor:pointer" onclick="gotoTypeOrBlock('pe')"><div class="kpi-stripe" style="background:var(--c-pe)"></div>
          <div class="kpi-l">◉ Private Equity</div>
          <div class="kpi-v">${fE(byType.pe||0)}</div>
          <div class="kpi-s">${unfunded ? `${fE(unfunded)} comprometido` : peBlocks.length+' fondos'}</div>
        </div>
        <div class="kpi" style="cursor:pointer" onclick="gotoTypeOrBlock('inmobiliario')"><div class="kpi-stripe" style="background:var(--c-inmob)"></div>
          <div class="kpi-l">◇ Inmobiliario</div>
          <div class="kpi-v">${fE(byType.inmobiliario||0)}</div>
          <div class="kpi-s">${blocks.filter(b=>!b.deleted&&b.type==='inmobiliario').length} activos</div>
        </div>
      </div>

      <!-- Asset allocation + Evolución -->
      <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-bottom:18px" class="dash-charts">
        <div class="card">
          <div class="card-hd">

            <button class="btn btn-soft btn-xs" onclick="goto('patrimonio')">Ver detalle →</button>

          <table class="tbl">
            <thead><tr>
              <th>Activo</th><th>Tipo</th><th class="r">Valor</th><th class="r">Peso</th>
            </tr></thead>
            <tbody>
              ${blocks.filter(b=>!b.deleted)
                .sort((a,b)=>(b.eur_value||b.value||0)-(a.eur_value||a.value||0))
                .slice(0,6).map(b => {
                  const v = b.eur_value||b.value||0;
                  const pct = t ? (v/t)*100 : 0;
                  return `<tr onclick="gotoBlock('${b.id}')">
                    <td><span style="display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--t-1)">
                      <span style="width:6px;height:6px;border-radius:50%;background:${BT[b.type].color}"></span>
                      ${esc(b.name)}</span></td>
                    <td>${BT[b.type].label}</td>
                    <td class="r mono">${fE(v)}</td>
                    <td class="r mono">${fP(pct)}</td>
                  </tr>`;
                }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--t-4);padding:30px">Aún no hay activos.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <!-- Suggested actions -->
      ${renderSuggestions(t, byType, cashNoRem, unfunded)}

  `;

  setTimeout(() => { drawDonut(byType, t); drawLine(); }, 50);
}

function renderSuggestions(t, byType, cashNoRem, unfunded) {
  const sugs = [];
  if (cashNoRem > 5000) {
    sugs.push({ic:'⚠', title:'Cash improductivo', body:`Tienes ${fE(cashNoRem)} en cuentas no remuneradas. Considera mover parte a una cuenta remunerada o vehículo de liquidez.`, type:'warn'});
  }
  if (unfunded > 0) {
    sugs.push({ic:'◉', title:'Compromisos pendientes', body:`${fE(unfunded)} de capital comprometido aún no llamado. Asegúrate de mantener liquidez para próximas calls.`, type:'info'});
  }
  if (t > 0 && (byType.bolsa||0)/t > 0.6) {
    sugs.push({ic:'!', title:'Concentración en bolsa', body:`Más del 60% del patrimonio está en mercados públicos. Revisa si la diversificación está alineada con tu perfil.`, type:'warn'});
  }
  if (sugs.length === 0) return '';

  return `<div class="card" style="margin-bottom:18px">
    <div class="card-hd"><div class="card-ti">✦ Para reflexionar</div></div>
    <div style="padding:0">
      ${sugs.map(s => `
        <div style="padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:14px;align-items:flex-start">
          <div style="width:32px;height:32px;border-radius:8px;background:var(--${s.type}-bg);color:var(--${s.type});display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0">${s.ic}</div>
          <div style="flex:1">
            <div style="font-size:12.5px;font-weight:600;color:var(--t-1);margin-bottom:3px">${s.title}</div>
            <div style="font-size:11.5px;color:var(--t-2);line-height:1.55">${s.body}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function drawDonut(byType, t) {
  const canvas = $('dash-donut');
  if (!canvas || !window.Chart) return;
  if (charts.donut) { charts.donut.destroy(); }

  const labels = Object.keys(byType).map(k => BT[k]?.label || k);
  const data = Object.values(byType);
  const colors = Object.keys(byType).map(k => {
    const cssVar = (BT[k]?.color || '').replace('var(--','').replace(')','');
    const map = {'c-cash':'#0C7B5A','c-bolsa':'#1B4FD8','c-fondos':'#6B3FA0','c-pe':'#B45309','c-inmob':'#B03060','c-otros':'#4B5563'};
    return map[cssVar] || '#7E8794';
  });

  charts.donut = new Chart(canvas, {
    type:'doughnut',
    data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:2, borderColor:'#fff'}]},
    options:{
      responsive:false, maintainAspectRatio:false, cutout:'68%',
      plugins:{ legend:{display:false} }
    }
  });

  const leg = $('dash-donut-leg');
  if (leg) {
    leg.innerHTML = Object.entries(byType).map(([k,v],i) =>
      `<div class="leg-row">
        <div class="leg-dot" style="background:${colors[i]}"></div>
        <div class="leg-name">${BT[k]?.label||k}</div>
        <div class="leg-val">${fE(v)}</div>
        <div class="leg-pct">${t?((v/t)*100).toFixed(0):0}%</div>
      </div>`).join('');
  }
}

function drawLine() {
  const canvas = $('dash-line');
  if (!canvas || !window.Chart) return;
  if (charts.line) { charts.line.destroy(); }

  // Simulación S&P comparable
  const startVal = history[0]?.total || total() || 100000;
  const sp = simulateSP500(history, startVal);

  charts.line = new Chart(canvas, {
    type:'line',
    data:{
      labels: history.map(h => fD(h.date)),
      datasets:[
        {label:'Patrimonio', data: history.map(h=>h.total), borderColor:'#1B4FD8', backgroundColor:'rgba(27,79,216,.08)', tension:.35, fill:true, borderWidth:2.5, pointRadius:3, pointBackgroundColor:'#1B4FD8'},
        {label:'S&P 500 (sim.)', data: sp, borderColor:'#9CA3AF', borderDash:[4,4], tension:.35, fill:false, borderWidth:1.5, pointRadius:0}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:true, position:'bottom', labels:{boxWidth:10, font:{size:10}, color:'#6B7280'}} },
      scales:{
        y:{ticks:{callback:v=>fE(v).replace('€',''), font:{size:10}, color:'#9CA3AF'}, grid:{color:'rgba(15,28,60,.05)'}},
        x:{ticks:{font:{size:10}, color:'#9CA3AF'}, grid:{display:false}}
      }
    }
  });
}

function simulateSP500(hist, startVal) {
  // Simulación simple para benchmark visual; en Fase 2 esto se conectará a datos reales
  if (!hist.length) return [];
  const monthlyReturn = 0.008; // ~10% anual aprox
  return hist.map((_,i) => Math.round(startVal * Math.pow(1 + monthlyReturn, i)));
}


// ─── 8. PATRIMONIO ───────────────────────────────────────────────────────
function renderPatr() {
  const p = $('p-patrimonio');
  const t = total();
  const grouped = {};
  blocks.filter(b=>!b.deleted).forEach(b => {
    if (!grouped[b.type]) grouped[b.type] = [];
    grouped[b.type].push(b);
  });

  const order = ['cash','bolsa','fondos','pe','inmobiliario','otros'];
  let html = `<div class="pc">`;

  // Empty state
  if (Object.keys(grouped).length === 0) {
    html += `
      <div class="empty">
        <div class="empty-ic">◇</div>
        <div class="empty-t">Empieza añadiendo tu primer activo</div>
        <div class="empty-s">Cuenta bancaria, broker, fondo, posición de PE, propiedad inmobiliaria... lo que tengas.</div>
        <button class="btn btn-primary" onclick="openAddBlock()">+ Añadir activo</button>
      </div>`;
    html += `</div>`;
    p.innerHTML = html;
    return;
  }

  order.forEach(type => {
    if (!grouped[type]) return;
    const arr = grouped[type];
    const sub = arr.reduce((s,b)=>s+(b.eur_value||b.value||0),0);
    const pct = t ? (sub/t)*100 : 0;
    const cfg = BT[type];

    html += `<div class="section-h">${cfg.label} <span style="margin-left:auto;color:var(--t-2);font-weight:500;text-transform:none;letter-spacing:0">${fE(sub)} · ${fP(pct)}</span></div>`;
    html += `<div class="bgrid">`;
    arr.forEach(b => {
      const v = b.eur_value||b.value||0;
      const wpct = t ? (v/t)*100 : 0;
      let meta = '';
      if (type === 'cash') meta = b.extra?.remunerada ? `<span class="tag tag-pos">Remunerada ${b.extra?.tipo?fP(b.extra.tipo):''}</span>` : '<span class="tag">No remunerada</span>';
      else if (type === 'pe') {
        const tvpi = b.extra?.tvpi;
        meta = tvpi ? `<span class="tag tag-info">TVPI ${tvpi.toFixed(2)}x</span>` : '';
      }
      else if (type === 'bolsa') meta = b.extra?.broker ? `<span class="tag">${esc(b.extra.broker)}</span>` : '';

      html += `
      <div class="bcard" onclick="gotoBlock('${b.id}')">
        <div class="bcard-stripe" style="background:${cfg.color}"></div>
        <div class="bcard-bd">
          <div class="bcard-row">
            <div class="bcard-icon" style="background:${cfg.color}1a;color:${cfg.color}">${cfg.ic}</div>
            <div class="bcard-pct">${fP(wpct)}</div>
          </div>
          <div class="bcard-name">${esc(b.name)}</div>
          <div class="bcard-sub">${esc(b.notes)||cfg.label}</div>
          <div class="bcard-val">${fE(v)}</div>
          <div class="bcard-meta">${meta}</div>
        </div>
      </div>`;
    });
    html += `<div class="bcard-add" onclick="openAddBlock('${type}')">
      <div class="bcard-add-ic">+</div>
      <div class="bcard-add-t">Añadir ${cfg.label.toLowerCase()}</div>
    </div>`;
    html += `</div>`;
  });

  // Tipos no usados aún
  const unused = order.filter(o => !grouped[o]);
  if (unused.length) {
    html += `<div class="section-h" style="margin-top:32px">Añadir otros tipos</div>`;
    html += `<div class="bgrid">`;
    unused.forEach(type => {
      const cfg = BT[type];
      html += `<div class="bcard-add" onclick="openAddBlock('${type}')" style="min-height:140px">
        <div class="bcard-add-ic" style="color:${cfg.color}">${cfg.ic}</div>
        <div class="bcard-add-t">${cfg.label}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  p.innerHTML = html;
}

function renderBolsaSection(b) {
  const e = b.extra || {};
  const positions = e.positions || [];
  const totalMV = positions.reduce((s,p) => s + (p.shares||0)*(p.current_price||p.entry_price||0), 0);
  const totalCost = positions.reduce((s,p) => s + (p.shares||0)*(p.entry_price||0), 0);
  const totalPnl = totalMV - totalCost;
  const totalPnlPct = totalCost ? (totalPnl/totalCost)*100 : 0;

  let html = `
    <div class="kpi-grid k4" style="margin-bottom:18px">
      <div class="kpi"><div class="kpi-stripe" style="background:var(--c-bolsa)"></div>

        <div class="kpi-l">Coste total</div>
        <div class="kpi-v">${fE(totalCost)}</div>

      <div class="kpi"><div class="kpi-stripe" style="background:${totalPnl>=0?'var(--pos)':'var(--neg)'}"></div>
        <div class="kpi-l">P&L</div>
        <div class="kpi-v" style="color:${totalPnl>=0?'var(--pos-d)':'var(--neg)'}">${totalPnl>=0?'+':''}${fE(totalPnl)}</div>
        <div class="kpi-s">${totalPnlPct>=0?'+':''}${totalPnlPct.toFixed(1)}%</div>
      </div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--brand)"></div>
        <div class="kpi-l">Posiciones</div>
        <div class="kpi-v-mono" style="font-size:22px">${positions.length}</div>
        <div class="kpi-s">${e.broker||'—'}</div>
      </div>
    </div>
  `;

  // Tabla de posiciones
  html += `
    <div class="card" style="margin-bottom:18px">
      <div class="card-hd">
        <div class="card-ti">Posiciones</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-soft btn-xs" onclick="openUploadFor('${b.id}')">⬆ Boletas</button>
          <button class="btn btn-primary btn-xs" onclick="openAddPosition('${b.id}')">+ Posición</button>
        </div>
      </div>
      ${positions.length ? `
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr>
              <th>Ticker</th><th class="r">Cantidad</th><th class="r">Precio entrada</th><th class="r">Precio actual</th><th class="r">Valor</th><th class="r">P&L</th><th class="r">Peso</th><th>Tesis</th>
            </tr></thead>
            <tbody>
              ${positions.map((p,idx) => {
                const mv = (p.shares||0) * (p.current_price||p.entry_price||0);
                const cost = (p.shares||0) * (p.entry_price||0);
                const pnl = mv - cost;
                const pnlPct = cost ? (pnl/cost)*100 : 0;
                const w = totalMV ? (mv/totalMV)*100 : 0;
                return `<tr onclick="openEditPosition('${b.id}',${idx})">
                  <td><strong style="color:var(--brand)">${esc(p.ticker)}</strong></td>
                  <td class="r mono">${p.shares}</td>
                  <td class="r mono">${fE2(p.entry_price)}</td>
                  <td class="r mono">${fE2(p.current_price||p.entry_price)}</td>
                  <td class="r mono">${fE(mv)}</td>
                  <td class="r mono ${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${fE(pnl)} (${pnlPct>=0?'+':''}${pnlPct.toFixed(1)}%)</td>
                  <td class="r mono">${fP(w)}</td>
                  <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--t-3)">${esc(p.thesis||'')}</td>

          </table>
        </div>
      ` : `
        <div class="card-bd">
          <div class="empty" style="padding:28px">
            <div class="empty-t">Sin posiciones registradas</div>
            <div class="empty-s">Añade posiciones manualmente o sube extractos/boletas del broker y la IA las extraerá.</div>
            <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
              <button class="btn btn-primary btn-sm" onclick="openAddPosition('${b.id}')">+ Añadir manual</button>
              <button class="btn btn-soft btn-sm" onclick="openUploadFor('${b.id}')">⬆ Subir boletas</button>
            </div>
          </div>
        </div>
      `}
    </div>
  `;

  // Información del broker
  html += `
    <div class="card" style="margin-bottom:18px">
      <div class="card-hd"><div class="card-ti">Información de cuenta</div></div>
      <div class="card-bd">
        <div class="extract">
          <div class="extract-row"><span class="extract-k">Broker</span><span class="extract-v">${esc(e.broker)||'—'}</span></div>
          <div class="extract-row"><span class="extract-k">Tipo de cuenta</span><span class="extract-v">${esc(e.account_type)||'Estándar'}</span></div>
          <div class="extract-row"><span class="extract-k">Moneda base</span><span class="extract-v">${b.currency||'EUR'}</span></div>
        </div>
      </div>
    </div>
  `;

  return html;
}

  const ticker = val('pos-ticker').trim().toUpperCase();
  const shares = parseFloat(val('pos-shares')||'0');
  const entry = parseFloat(val('pos-entry')||'0');
  const current = parseFloat(val('pos-current')) || entry;
  const date = val('pos-date');
  const thesis = val('pos-thesis').trim();

  if (!ticker) return toast('Ticker obligatorio','err');
  if (!shares || shares <= 0) return toast('Cantidad inválida','err');
  if (!entry || entry <= 0) return toast('Precio de entrada inválido','err');

  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  b.extra = b.extra || {};
  b.extra.positions = b.extra.positions || [];

  const pos = {ticker, shares, entry_price: entry, current_price: current, date, thesis};

  if (idx >= 0 && idx < b.extra.positions.length) {
    b.extra.positions[idx] = pos;
  } else {
    b.extra.positions.push(pos);
  }

  // Recalcular valor total del bloque
  const totalMV = b.extra.positions.reduce((s,p) => s + (p.shares||0)*(p.current_price||p.entry_price||0), 0);
  b.value = totalMV;
  b.eur_value = totalMV;
  b.updated_at = new Date().toISOString();

  await saveBlockDB(b);
  await snapshotPatrimonio();
  toast(idx >= 0 ? 'Posición actualizada' : 'Posición añadida');
  closeModal();
  renderBlockDetail(blockId);
  renderSidebar();
}

async function deletePosition(blockId, idx) {
  if (!confirm('¿Eliminar esta posición?')) return;
  const b = blocks.find(x => x.id === blockId);
  if (!b?.extra?.positions) return;
  b.extra.positions.splice(idx, 1);
  const totalMV = b.extra.positions.reduce((s,p) => s + (p.shares||0)*(p.current_price||p.entry_price||0), 0);
  b.value = totalMV;
  b.eur_value = totalMV;
  b.updated_at = new Date().toISOString();
  await saveBlockDB(b);
  await snapshotPatrimonio();
  toast('Posición eliminada');
  closeModal();
  renderBlockDetail(blockId);
  renderSidebar();
}

async function saveBlock(type, id) {
  const name = val('bm-name').trim();
  const value = parseFloat(val('bm-val')||'0');
  const currency = val('bm-cur');
  const notes = val('bm-notes').trim();

  if (!name) return toast('Necesitas un nombre','err');
  if (!value || value < 0) return toast('Valor inválido','err');

  const extra = {};
  if (type === 'cash') {
    extra.remunerada = val('bm-remunerada') === 'true';
    if (val('bm-tipo')) extra.tipo = parseFloat(val('bm-tipo'));
  } else if (type === 'bolsa') {
    extra.broker = val('bm-broker').trim();
  } else if (type === 'fondos') {
    extra.gestora = val('bm-gestora').trim();
    if (val('bm-fee')) extra.fee = parseFloat(val('bm-fee'));
  } else if (type === 'pe') {
    extra.gp = val('bm-gp').trim();
    extra.vintage = val('bm-vintage').trim();
    extra.estrategia = val('bm-estrategia').trim();
    extra.geografia = val('bm-geografia').trim();
    if (val('bm-committed')) extra.committed = parseFloat(val('bm-committed'));
    if (val('bm-called')) extra.called = parseFloat(val('bm-called'));
    if (val('bm-distributed')) extra.distributed = parseFloat(val('bm-distributed'));
    if (val('bm-tvpi')) extra.tvpi = parseFloat(val('bm-tvpi'));
    if (val('bm-dpi')) extra.dpi = parseFloat(val('bm-dpi'));
    if (val('bm-irr')) extra.irr = parseFloat(val('bm-irr'));
    if (extra.committed && extra.called && !extra.rvpi) {
      extra.rvpi = (value / extra.committed).toFixed(2);
    }
  } else if (type === 'inmobiliario') {
    extra.tipo = val('bm-tipo-inm');
    if (val('bm-m2')) extra.m2 = parseFloat(val('bm-m2'));
    extra.direccion = val('bm-dir').trim();
    if (val('bm-hipo')) extra.hipoteca = parseFloat(val('bm-hipo'));
  }

  const now = new Date().toISOString();
  if (id) {
    const b = blocks.find(x=>x.id===id);
    if (b) {
      b.name = name; b.value = value; b.eur_value = value;
      b.currency = currency; b.notes = notes; b.extra = extra;
      b.updated_at = now;
      await saveBlockDB(b);
    }
  } else {
    const b = {
      id: gId(), type, name, value, eur_value: value,
      currency, notes, extra,
      created_at: now, updated_at: now
    };
    blocks.push(b);
    await saveBlockDB(b);
  }
  await snapshotPatrimonio();
  toast(id ? 'Activo actualizado' : 'Activo añadido');
  closeModal();
  if (currentPage === 'patrimonio') renderPatr();
  else if (currentPage === 'dashboard') renderDash();
  else if (currentPage === 'block-detail') renderBlockDetail(id || blocks[blocks.length-1].id);
  renderSidebar();
}

async function saveTx() {
  const kind = val('tx-kind');
  const amount = parseFloat(val('tx-amount')||'0');
  const date = val('tx-date');
  const note = val('tx-note').trim();
  if (!amount) return toast('Importe inválido','err');

  const tx = {id: gId(), block_id: currentBlockForTx, kind, amount, date, note};
  txs.push(tx);
  await saveTxDB(tx);

  // Actualizar agregados del bloque
  const b = blocks.find(x => x.id === currentBlockForTx);
  if (b) {
    b.extra = b.extra || {};
    if (kind === 'call') b.extra.called = (b.extra.called||0) + amount;
    if (kind === 'distribution') b.extra.distributed = (b.extra.distributed||0) + amount;
    if (kind === 'commitment') b.extra.committed = (b.extra.committed||0) + amount;
    b.updated_at = new Date().toISOString();
    await saveBlockDB(b);
  }

  toast(`✓ ${kind==='call'?'Capital call':kind==='distribution'?'Distribución':'Compromiso'} registrado`);

  renderBlockDetail(currentBlockForTx);
}

ACTIVO:
${BT[b.type].label}: ${b.name}
Valor: ${fE(b.eur_value||b.value||0)} (${t>0?((b.eur_value||b.value||0)/t*100).toFixed(1):0}% del total)

${b.extra?`Detalle: ${JSON.stringify(b.extra)}`:''}

OTROS ACTIVOS: ${blocks.filter(x=>!x.deleted&&x.id!==id).map(x=>`${BT[x.type].label} (${x.name}): ${fE(x.eur_value||x.value||0)}`).join(', ')||'ninguno'}

  try {

      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model: AI_MODEL, max_tokens:600, messages:[{role:'user',content:prompt}]})

function renderLocalBlockAnalysis(b, t) {
  const v = b.eur_value||b.value||0;
  const pct = t ? (v/t)*100 : 0;
  let html = `<div style="font-size:12.5px;line-height:1.75;color:var(--t-1);font-weight:300">`;
  html += `<strong style="color:var(--brand);font-weight:600">Estado actual.</strong> `;
  html += `${b.name} representa el <strong>${fP(pct)}</strong> de tu patrimonio (${fE(v)} sobre ${fE(t)}). `;
  if (pct > 40) html += `Es una posición muy concentrada — más del 40% en un solo activo.`;
  else if (pct < 5) html += `Es una posición pequeña dentro del conjunto.`;
  else html += `Tiene un peso moderado.`;
  html += `<br><br><strong style="color:var(--brand);font-weight:600">Puntos de atención.</strong> `;
  if (b.type === 'pe' && b.extra?.committed) {
    const unfunded = (b.extra.committed||0) - (b.extra.called||0);
    if (unfunded > 0) html += `Tienes ${fE(unfunded)} comprometido pendiente de llamar — asegura liquidez para ello. `;
  }

function categorizeExpense(concept) {
  const c = (concept||'').toLowerCase();
  for (const cat of EXPENSE_CATEGORIES) {
    if (cat.kw.some(kw => c.includes(kw))) return cat;

function parseFlujosExcel(file) {
  if (typeof XLSX === 'undefined') return toast('XLSX no cargado','err');
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {raw:false, defval:''});

      // Heurística: detectar columnas de fecha, concepto e importe
      const sample = json[0] || {};
      const keys = Object.keys(sample);
      const dateK = keys.find(k => /fecha|date/i.test(k)) || keys[0];
      const conceptK = keys.find(k => /concepto|descrip|detail|memo/i.test(k)) || keys[1];
      const amountK = keys.find(k => /import|amount|cantidad|valor/i.test(k)) || keys[2];

      const itemsByMonth = {};
      json.forEach(row => {
        const dateRaw = row[dateK];
        const concept = String(row[conceptK]||'').trim();
        let amount = row[amountK];
        if (typeof amount === 'string') {
          amount = parseFloat(amount.replace(/\./g,'').replace(',','.'));
        }
        if (!dateRaw || !concept || isNaN(amount)) return;
        const date = new Date(dateRaw);
        if (isNaN(date.getTime())) return;
        const monthKey = date.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
        const cat = categorizeExpense(concept);
        if (!itemsByMonth[monthKey]) itemsByMonth[monthKey] = {month: monthKey, items:[]};
        itemsByMonth[monthKey].items.push({
          date: date.toISOString().slice(0,10),
          concept, amount, category: cat.label, icon: cat.icon, color: cat.color
        });
      });

      flujos = Object.values(itemsByMonth).sort((a,b)=>new Date(a.items[0].date) - new Date(b.items[0].date));
      toast(`✓ ${json.length} movimientos importados en ${flujos.length} meses`);
      renderFlujos();
    } catch(err) {
      console.error(err);
      toast('Error al procesar el Excel','err');
    }
  };
  reader.readAsArrayBuffer(file);
}

async function downloadDoc(id) {
  const d = docs.find(x => x.id === id);
  if (!d || !d.storage_path || demo) return;
  try {
    const { data, error } = await sb.storage.from('wealth-docs').createSignedUrl(d.storage_path, 300);
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch(e) {
    toast('No se pudo descargar', 'err');
  }
}

async function deleteDoc(id) {
  if (!confirm('¿Eliminar documento?')) return;
  const d = docs.find(x => x.id === id);
  if (!d) return;
  try {
    if (!demo) {
      if (d.storage_path) await sb.storage.from('wealth-docs').remove([d.storage_path]);
      await sb.from('documents').delete().eq('id', d.id);
    }
    docs = docs.filter(x => x.id !== id);
    toast('Documento eliminado');
    if (currentPage === 'documentos') renderDocs();
    if (currentPage === 'block-detail' && d.block_id) renderBlockDetail(d.block_id);
  } catch(e) {
    toast('Error al eliminar', 'err');
  }
}

function downloadReportText(text) {
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wealthos-informe-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function computeInsights() {
  const t = total();
  const list = [];
  const active = blocks.filter(b => !b.deleted);
  const byType = {};
  active.forEach(b => byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0));

  // 1. Cash improductivo
  const cashNoRem = active.filter(b => b.type==='cash' && !b.extra?.remunerada)
    .reduce((s,b)=>s+(b.eur_value||b.value||0),0);
  if (cashNoRem > 5000) {
    list.push({
      ic:'⚠', tone:'warn',
      title:'Cash improductivo detectado',
      body:`Tienes <strong>${fE(cashNoRem)}</strong> en cuentas no remuneradas. A un 3% anual estás dejando aproximadamente <strong>${fE(cashNoRem*0.03)}</strong> al año en intereses no devengados. Considera mover una parte a una cuenta remunerada (Revolut, Trade Republic, MyInvestor, BBVA Cuenta Online) o un fondo monetario.`,
      action:`goto('patrimonio')`, actionLabel:'Revisar cuentas →'
    });
  }

  // 2. Capital comprometido pendiente
  const peBlocks = active.filter(b => b.type==='pe');
  const totalUnfunded = peBlocks.reduce((s,b)=>s+((b.extra?.committed||0)-(b.extra?.called||0)),0);
  const totalLiquid = active.filter(b=>b.type==='cash').reduce((s,b)=>s+(b.eur_value||b.value||0),0);
  if (totalUnfunded > 0) {
    const ratio = totalLiquid ? totalUnfunded/totalLiquid : 999;
    if (ratio > 0.5) {
      list.push({
        ic:'!', tone:'warn',
        title:'Liquidez ajustada para tus compromisos',
        body:`Tu cash disponible (${fE(totalLiquid)}) representa un <strong>${(1/ratio*100).toFixed(0)}%</strong> del capital comprometido pendiente (${fE(totalUnfunded)}). Si llegan capital calls juntas podrías tener problema de liquidez. Revisa el calendario de las gestoras.`
      });
    } else {
      list.push({
        ic:'◉', tone:'info',
        title:'Compromisos pendientes',
        body:`Tienes <strong>${fE(totalUnfunded)}</strong> de capital comprometido aún no llamado en ${peBlocks.length} fondo${peBlocks.length>1?'s':''} de PE. Tu cash actual cubre este compromiso ${(1/ratio).toFixed(1)}× — situación cómoda.`
      });
    }
  }

  // 3. Concentración
  const sorted = active.sort((a,b)=>(b.eur_value||b.value||0)-(a.eur_value||a.value||0));
  if (sorted.length && t > 0) {
    const top = sorted[0];
    const topPct = ((top.eur_value||top.value||0)/t)*100;
    if (topPct > 35) {
      list.push({
        ic:'◐', tone:'warn',
        title:'Concentración elevada',
        body:`Tu posición más grande (<strong>${esc(top.name)}</strong>) representa el <strong>${fP(topPct)}</strong> del patrimonio. Por encima del 35% en un solo activo es exposición concentrada — está bien si refleja tu convicción, pero asegúrate de que sea consciente.`,
        action:`gotoBlock('${top.id}')`, actionLabel:'Ver detalle →'
      });
    }
  }

  // 4. Allocation tipos
  if (t > 0) {
    const bolsaPct = ((byType.bolsa||0)/t)*100;
    if (bolsaPct > 60) {
      list.push({
        ic:'◊', tone:'warn',
        title:'Cartera muy expuesta a renta variable',
        body:`Más del <strong>${bolsaPct.toFixed(0)}%</strong> está en bolsa directa. Si tu horizonte es largo puede tener sentido — verifica que la diversificación geográfica/sectorial dentro del broker esté equilibrada.`
      });
    }
    const liquidPct = ((byType.cash||0)/t)*100;
    if (liquidPct > 30) {
      list.push({
        ic:'◇', tone:'info',
        title:'Mucha liquidez',
        body:`Un <strong>${liquidPct.toFixed(0)}%</strong> del patrimonio en cash. Está bien si tienes calls pendientes o oportunidades en pipeline, pero a inflación 2-3% este capital pierde poder adquisitivo.`
      });
    }
  }

  // 5. PE performance
  peBlocks.forEach(b => {
    if (b.extra?.tvpi && b.extra.tvpi < 0.9) {
      list.push({
        ic:'↓', tone:'neg',
        title:`${b.name} · TVPI por debajo de 1.0x`,
        body:`Este fondo tiene un TVPI de <strong>${b.extra.tvpi.toFixed(2)}x</strong>, lo que indica que el valor total (NAV + distribuciones) está por debajo del capital llamado. Normal en vintages tempranos (J-curve), pero merece seguimiento.`,
        action:`gotoBlock('${b.id}')`, actionLabel:'Ver fondo →'
      });
    }
  });

  // 6. Crecimiento histórico
  if (history.length >= 2) {
    const first = history[0].total, last = history[history.length-1].total;
    if (first > 0) {
      const growth = ((last-first)/first)*100;
      const months = history.length;
      if (Math.abs(growth) > 1) {
        list.push({
          ic: growth >= 0 ? '↑' : '↓',
          tone: growth >= 0 ? 'pos' : 'neg',
          title: `Patrimonio ${growth>=0?'creciendo':'a la baja'}: ${fP(growth)} en ${months}M`,
          body: `Tu patrimonio ha pasado de <strong>${fE(first)}</strong> a <strong>${fE(last)}</strong> en ${months} meses. ${growth>=0?'Buen ritmo':'Revisa qué está pesando — puede ser drawdown puntual o algo estructural'}.`,
        });
      }
    }
  }

  // 7. Activos sin actualizar
  const stale = active.filter(b => {
    if (!b.updated_at) return false;
    const days = (Date.now() - new Date(b.updated_at).getTime()) / (1000*60*60*24);
    return days > 60;
  });
  if (stale.length) {
    list.push({
      ic:'⏱', tone:'info',
      title:`${stale.length} activo${stale.length>1?'s':''} sin actualizar`,
      body:`${stale.map(b=>esc(b.name)).join(', ')} llevan más de 60 días sin actualizar valor. Considera actualizar para que el patrimonio total refleje la realidad.`
    });
  }

  return list;
}

  if (inp && !forceText) inp.value = '';

  chat.push({role:'user', text});
  renderChatMsgs();

  // Indicador de typing
  chat.push({role:'ai', text:'<span class="dots"><span>·</span><span>·</span><span>·</span></span>', loading:true});
  renderChatMsgs();

  try {
    const ctx = buildPatrimonialContext();
    const messages = [
      {role:'system', content: `Eres el advisor patrimonial de WealthOS, una plataforma de gestión patrimonial premium para inversores sofisticados. Estilo: directo, claro, profesional, sin florituras. Respondes en español. Usas los datos reales del usuario que te paso a continuación. NO eres un asesor financiero regulado — recuérdalo si la conversación va a recomendaciones específicas.\n\n=== ESTADO PATRIMONIAL DEL USUARIO ===\n${ctx}\n=== FIN DEL ESTADO ===`},
      ...chat.filter(m=>!m.loading).slice(-10).map(m => ({
        role: m.role === 'ai' ? 'assistant' : 'user',
        content: m.text
      }))
    ];

    const r = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model: AI_MODEL, max_tokens: 800, messages})
    });
    if (!r.ok) throw new Error('api');
    const d = await r.json();
    const reply = d?.content?.[0]?.text || '';
    if (!reply) throw new Error('empty');

    chat = chat.filter(m=>!m.loading);
    chat.push({role:'ai', text: reply});
    renderChatMsgs();
  } catch(e) {
    console.warn('chat error', e);
    chat = chat.filter(m=>!m.loading);
    chat.push({role:'ai', text: localChatFallback(text)});
    renderChatMsgs();
  }
}

function buildPatrimonialContext() {
  const t = total();
  const active = blocks.filter(b => !b.deleted);
  if (active.length === 0) return 'Patrimonio: sin activos registrados aún.';

  const byType = {};
  active.forEach(b => byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0));

  let ctx = `Patrimonio total: ${fE(t)}\n`;
  ctx += `Distribución: ${Object.entries(byType).map(([k,v]) => `${BT[k].label} ${fE(v)} (${fP(t?(v/t)*100:0)})`).join(' · ')}\n\n`;

  ctx += `ACTIVOS DETALLE:\n`;
  active.forEach(b => {
    let line = `- ${b.name} [${BT[b.type].label}]: ${fE(b.eur_value||b.value||0)}`;
    if (b.notes) line += ` — ${b.notes}`;
    if (b.type === 'pe' && b.extra) {
      const e = b.extra;
      const parts = [];
      if (e.gp) parts.push(`GP: ${e.gp}`);
      if (e.vintage) parts.push(`vintage ${e.vintage}`);
      if (e.committed) parts.push(`committed ${fE(e.committed)}`);
      if (e.called) parts.push(`called ${fE(e.called)}`);
      if (e.tvpi) parts.push(`TVPI ${e.tvpi.toFixed(2)}x`);
      if (e.dpi !== undefined && e.dpi !== null) parts.push(`DPI ${e.dpi.toFixed(2)}x`);
      if (parts.length) line += ` (${parts.join(', ')})`;
    }
    if (b.type === 'cash' && b.extra) {
      line += b.extra.remunerada ? ` (remunerada ${b.extra.tipo||'?'}%)` : ` (no remunerada)`;
    }
    ctx += line + '\n';
  });

  // Histórico
  if (history.length >= 2) {
    const first = history[0], last = history[history.length-1];
    ctx += `\nHISTÓRICO: de ${fE(first.total)} (${fD(first.date)}) a ${fE(last.total)} (${fD(last.date)})`;
    if (first.total > 0) ctx += ` — variación ${fP(((last.total-first.total)/first.total)*100)}\n`;
  }

  // Cash flow
  if (flujos.length) {
    let ing = 0, gas = 0;
    flujos.forEach(m => m.items?.forEach(i => i.amount > 0 ? ing += i.amount : gas += Math.abs(i.amount)));
    ctx += `\nCASH FLOW (${flujos.length}M): ingresos ${fE(ing)}, gastos ${fE(gas)}, ahorro neto ${fE(ing-gas)}\n`;
  }

  return ctx;
}

function localChatFallback(text) {
  const t = total();
  const active = blocks.filter(b => !b.deleted);
  const lower = text.toLowerCase();

  if (lower.includes('cómo está') || lower.includes('como esta') || lower.includes('estado') || lower.includes('resumen') || lower.includes('cartera')) {
    const byType = {};
    active.forEach(b => byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0));
    return `Tu patrimonio total es <strong>${fE(t)}</strong> distribuido en ${active.length} activo${active.length>1?'s':''}.\n\n` +
      Object.entries(byType).map(([k,v]) => `**${BT[k].label}**: ${fE(v)} (${fP(t?(v/t)*100:0)})`).join('\n') +
      `\n\n_(Advisor IA temporalmente offline · análisis local desde tus datos)_`;
  }

  if (lower.includes('cash') || lower.includes('liquidez')) {
    const cash = active.filter(b => b.type==='cash');
    const cashTotal = cash.reduce((s,b)=>s+(b.eur_value||b.value||0),0);
    const noRem = cash.filter(b=>!b.extra?.remunerada).reduce((s,b)=>s+(b.eur_value||b.value||0),0);
    return `Tienes <strong>${fE(cashTotal)}</strong> en cash (${cash.length} cuenta${cash.length>1?'s':''}). De eso, <strong>${fE(noRem)}</strong> no genera intereses. ${noRem>5000?'Considera mover esa parte a una cuenta remunerada — a 3% anual son '+fE(noRem*0.03)+' al año.':'Buen ratio remunerado.'}`;
  }

  if (lower.includes('pe') || lower.includes('private equity') || lower.includes('fondo')) {
    const pe = active.filter(b => b.type==='pe');
    if (!pe.length) return 'No tienes ninguna posición de Private Equity registrada todavía.';
    return pe.map(b => {
      const e = b.extra || {};
      return `**${esc(b.name)}** — NAV ${fE(b.eur_value||b.value||0)}` +
        (e.committed ? `, committed ${fE(e.committed)}, called ${fE(e.called||0)}` : '') +
        (e.tvpi ? `, TVPI ${e.tvpi.toFixed(2)}x` : '') +
        (e.dpi !== undefined ? `, DPI ${e.dpi.toFixed(2)}x` : '');
    }).join('\n\n');
  }

  return `Lo siento, el advisor está temporalmente offline. Mientras tanto puedes preguntarme cosas concretas como "¿cómo está mi cartera?", "¿cuánto cash tengo?", "analiza mis fondos de PE", o navegar por las secciones de la app para ver el estado completo de tu patrimonio.`;
}

        <div class="upz-s">${isFlujo?'Formato XLSX, XLS o CSV — extracto del banco':'PDF, XLSX, DOCX, imagen — máx 10MB'}</div>
      </div>

      <div id="up-status" style="margin-top:14px"></div>
    </div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  `);

  // Drag & drop
  const upz = $('upz');
  if (upz) {
    ['dragover','dragenter'].forEach(ev => upz.addEventListener(ev, e => { e.preventDefault(); upz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev => upz.addEventListener(ev, e => { e.preventDefault(); upz.classList.remove('drag'); }));

function openUploadFor(blockId) {
