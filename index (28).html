async function handleFile(file, contextType) {
  if (!file) return;
  $('upload-progress').innerHTML = `<div style="text-align:center;padding:16px"><div class="dots"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--t-3);margin-top:8px">Procesando ${esc(file.name)}...</div></div>`;
  
  const ext = file.name.split('.').pop().toLowerCase();
  
  try {
    if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
      if (contextType === 'flujos') {
        await parseFlujosExcel(file);
      } else if (contextType === 'bolsa') {
        await parseBolsaExcel(file);
      } else {
        // Auto-detect
        await parseExcelAuto(file);
      }
    } else if (ext === 'pdf') {
      await processPDF(file);
    } else {
      toast('Formato no soportado','err');
    }
    closeModal();
  } catch(e) {
    console.error(e);
    toast('Error procesando: ' + (e.message||'desconocido'), 'err');
    $('upload-progress').innerHTML = `<div style="color:var(--neg);font-size:11.5px;padding:10px">Error: ${esc(e.message||'No se pudo procesar')}</div>`;
  }
}

async function parseFlujosExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  
  // Parser de números robusto: maneja formato anglosajón (1,473.89) y europeo (1.473,89)
  const parseNum = (v) => {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return v;
    let s = String(v).trim().replace(/[€$\s]/g, '');
    if (!s) return 0;
    
    const hasComma = s.includes(',');
    const hasDot = s.includes('.');
    
    if (hasComma && hasDot) {
      // Ambos: el último que aparezca es el decimal
      const lastComma = s.lastIndexOf(',');
      const lastDot = s.lastIndexOf('.');
      if (lastDot > lastComma) {
        // formato 1,473.89 → quitar comas (miles), punto = decimal
        s = s.replace(/,/g, '');
      } else {
        // formato 1.473,89 → quitar puntos (miles), coma = decimal
        s = s.replace(/\./g, '').replace(',', '.');
      }
    } else if (hasComma && !hasDot) {
      // Solo coma: si tiene 3 dígitos después y solo una coma → miles, sino decimal
      const parts = s.split(',');
      if (parts.length === 2 && parts[1].length === 3 && !/[a-zA-Z]/.test(s)) {
        // ambiguo "1,234" → asumir miles solo si el número total >= 1000
        const asThousand = parseFloat(s.replace(',',''));
        const asDecimal = parseFloat(s.replace(',','.'));
        s = asThousand >= 1000 ? s.replace(',','') : s.replace(',','.');
      } else {
        s = s.replace(',', '.');
      }
    }
    // Si solo punto o ninguno: parseFloat normal
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  };
  
  // Detectar formato: ¿multi-hoja por mes o hoja única con todo?
  const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const sheetsLower = wb.SheetNames.map(n => n.toLowerCase().trim());
  const isMultiMonth = sheetsLower.filter(n => monthNames.includes(n)).length >= 2;
  
  const items = [];
  const byMonth = {};
  const currentYear = new Date().getFullYear();
  
  if (isMultiMonth) {
    // FORMATO PEPE: una hoja por mes (Enero, Febrero, ...) con columnas Fecha | Concepto | Gasto | Ingreso
    wb.SheetNames.forEach(sheetName => {
      const lower = sheetName.toLowerCase().trim();
      const monthIdx = monthNames.indexOf(lower);
      if (monthIdx < 0) return; // skip non-month sheets
      
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {raw:false, defval:''});
      if (rows.length === 0) return;
      
      // Detectar columnas de gasto e ingreso
      const keys = Object.keys(rows[0]);
      const gastoKey = keys.find(k => /gasto/i.test(k));
      const ingresoKey = keys.find(k => /ingreso/i.test(k));
      const importeKey = keys.find(k => /importe/i.test(k));
      const conceptoKey = keys.find(k => /concepto/i.test(k));
      const fechaKey = keys.find(k => /fecha/i.test(k));
      
      const monthKey = sheetName.charAt(0).toUpperCase() + sheetName.slice(1).toLowerCase() + ' ' + currentYear;
      byMonth[monthKey] = byMonth[monthKey] || [];
      
      rows.forEach(r => {
        const concepto = (r[conceptoKey] || '').toString().trim();
        if (!concepto) return;
        
        // Parsear gasto (negativo) o ingreso (positivo)
        let amount = 0;
        if (gastoKey && ingresoKey) {
          // Formato Pepe: dos columnas separadas
          const gasto = parseNum(r[gastoKey]);
          const ingreso = parseNum(r[ingresoKey]);
          if (ingreso !== 0) amount = Math.abs(ingreso);
          else if (gasto !== 0) amount = -Math.abs(gasto);
        } else if (importeKey) {
          amount = parseNum(r[importeKey]);
        }
        
        if (amount === 0) return;
        
        // Parsear fecha (puede venir como "01/Enero" o YYYY-MM-DD)
        let dateStr = (r[fechaKey] || '').toString().trim();
        let isoDate = '';
        if (/^\d{4}-\d{2}-\d{2}/.test(dateStr)) {
          isoDate = dateStr.slice(0,10);
        } else if (/^\d{1,2}\/[A-Za-zÁ-ú]+/.test(dateStr)) {
          // Formato "01/Enero" → construir fecha
          const parts = dateStr.split('/');
          const day = parseInt(parts[0]) || 1;
          const monthName = parts[1].toLowerCase().trim();
          const mIdx = monthNames.indexOf(monthName);
          if (mIdx >= 0) {
            isoDate = `${currentYear}-${String(mIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          }
        }
        if (!isoDate) {
          isoDate = `${currentYear}-${String(monthIdx+1).padStart(2,'0')}-01`;
        }
        
        const cat = categorizeExpense(concepto);
        const item = {date: isoDate, concept: concepto, amount, category: cat};
        items.push(item);
        byMonth[monthKey].push(item);
      });
    });
  } else {
    // FORMATO TEMPLATE OFICIAL: una hoja con Fecha | Concepto | Importe
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {raw:false, defval:''});
    if (rows.length === 0) throw new Error('Excel vacío');
    
    const first = rows[0];
    const keys = Object.keys(first);
    const hasFecha = keys.some(k => /fecha/i.test(k));
    const hasConcepto = keys.some(k => /concepto/i.test(k));
    const hasImporte = keys.some(k => /importe/i.test(k));
    const hasGasto = keys.some(k => /gasto/i.test(k));
    const hasIngreso = keys.some(k => /ingreso/i.test(k));
    
    if (!hasFecha || !hasConcepto || (!hasImporte && !(hasGasto && hasIngreso))) {
      throw new Error('El Excel debe tener columnas: Fecha, Concepto e Importe (o Gasto/Ingreso separados)');
    }
    
    const fechaKey = keys.find(k => /fecha/i.test(k));
    const conceptoKey = keys.find(k => /concepto/i.test(k));
    const importeKey = keys.find(k => /importe/i.test(k));
    const gastoKey = keys.find(k => /gasto/i.test(k));
    const ingresoKey = keys.find(k => /ingreso/i.test(k));
    
    rows.forEach(r => {
      const fecha = (r[fechaKey] || '').toString();
      const concepto = (r[conceptoKey] || '').toString().trim();
      if (!fecha || !concepto) return;
      
      let amount = 0;
      if (importeKey) {
        amount = parseNum(r[importeKey]);
      } else if (gastoKey && ingresoKey) {
        const gasto = parseNum(r[gastoKey]);
        const ingreso = parseNum(r[ingresoKey]);
        if (ingreso !== 0) amount = Math.abs(ingreso);
        else if (gasto !== 0) amount = -Math.abs(gasto);
      }
      if (amount === 0) return;
      
      const cat = categorizeExpense(concepto);
      items.push({date: fecha, concept: concepto, amount, category: cat});
    });
    
    items.forEach(it => {
      const m = new Date(it.date).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
      const cap = m.charAt(0).toUpperCase() + m.slice(1);
      byMonth[cap] = byMonth[cap] || [];
      byMonth[cap].push(it);
    });
  }
  
  if (items.length === 0) {
    throw new Error('No se detectaron movimientos válidos. Revisa el formato del Excel.');
  }
  
  // Ordenar meses por orden cronológico
  const monthOrder = monthNames.map(m => m.charAt(0).toUpperCase()+m.slice(1));
  const orderedFlujos = Object.entries(byMonth)
    .filter(([_, its]) => its.length > 0)
    .sort((a,b) => {
      const ma = monthOrder.findIndex(m => a[0].includes(m));
      const mb = monthOrder.findIndex(m => b[0].includes(m));
      return ma - mb;
    })
    .map(([month, items]) => ({month, items}));
  
  flujos = orderedFlujos;
  toast(`✓ ${items.length} movimientos cargados en ${orderedFlujos.length} meses`);
  renderFlujos();
}

async function parseBolsaExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('trans')) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {raw:false});
  
  if (rows.length === 0) throw new Error('Excel vacío');
  
  // Agrupar por ticker
  const positions = {};
  rows.forEach(r => {
    const ticker = (r.Ticker || r.ticker || r.Symbol || '').toString().toUpperCase().trim();
    if (!ticker) return;
    const action = (r.Acción || r.Accion || r.Action || '').toString().toLowerCase();
    const qty = parseFloat(String(r.Cantidad || r.Qty || 0).replace(',','.'));
    const price = parseFloat(String(r['Precio unitario'] || r.Precio || r.Price || 0).replace(',','.'));
    if (!qty || !price) return;
    
    positions[ticker] = positions[ticker] || {ticker, shares:0, totalCost:0};
    if (action.includes('compra') || action.includes('buy')) {
      positions[ticker].shares += qty;
      positions[ticker].totalCost += qty * price;
    } else if (action.includes('venta') || action.includes('sell')) {
      const avgCost = positions[ticker].shares ? positions[ticker].totalCost / positions[ticker].shares : 0;
      positions[ticker].shares -= qty;
      positions[ticker].totalCost -= qty * avgCost;
    }
  });
  
  const posArray = Object.values(positions).filter(p => p.shares > 0).map(p => ({
    ticker: p.ticker,
    shares: parseFloat(p.shares.toFixed(4)),
    entry_price: parseFloat((p.totalCost / p.shares).toFixed(2)),
    current_price: parseFloat((p.totalCost / p.shares).toFixed(2)),
    date: new Date().toISOString().slice(0,10),
    thesis: '',
    classification: 'core'
  }));
  
  if (posArray.length === 0) throw new Error('No se detectaron posiciones');
  
  // Crear o actualizar bloque
  let block = uploadBlockId ? blocks.find(b => b.id === uploadBlockId) : null;
  if (!block) {
    block = {
      id: gId(), user_id: user?.id, type:'bolsa', name:'Bolsa importada', currency:'EUR',
      extra:{broker:'', positions:[]}, value:0, eur_value:0, created_at: new Date().toISOString()
    };
    blocks.push(block);
  }
  block.extra = block.extra || {};
  block.extra.positions = posArray;
  const totalMV = posArray.reduce((s,p) => s + p.shares * p.current_price, 0);
  block.value = totalMV; block.eur_value = totalMV;
  block.updated_at = new Date().toISOString();
  
  await saveBlockDB(block);
  await snapshotPatrimonio();
  toast(`✓ ${posArray.length} posiciones importadas`);
  gotoBlock(block.id);
}

async function parseExcelAuto(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const names = wb.SheetNames.map(n => n.toLowerCase().trim());
  
  // Detectar formato multi-hoja por mes (Enero, Febrero, ...)
  const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const monthSheetCount = names.filter(n => monthNames.includes(n)).length;
  if (monthSheetCount >= 2) {
    return parseFlujosExcel(file);
  }
  
  if (names.some(n => n.includes('trans') || n.includes('order'))) {
    return parseBolsaExcel(file);
  }
  if (names.some(n => n.includes('movi') || n.includes('flujo') || n.includes('gasto'))) {
    return parseFlujosExcel(file);
  }
  // Default: try as flujos
  try { return await parseFlujosExcel(file); }
  catch { return parseBolsaExcel(file); }
}

  try {

  }
  btn.disabled = false; btn.textContent = 'Regenerar';
}
