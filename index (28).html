<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WealthOS v3.2 · Brokerage Core/Táctico — Sistema patrimonial</title>
<meta name="description" content="WealthOS es tu copiloto patrimonial inteligente. Detecta oportunidades, recuerda acciones, ayuda a decidir.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1B4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* SURFACES — TODO BLANCO/CLARO */
  --bg:#F8FAFC;
  --surf:#FFFFFF;
  --surf-2:#F8FAFC;
  --surf-3:#F1F5F9;
  --surf-4:#E2E8F0;

  /* LINES */
  --line:rgba(15,28,60,.07);
  --line-2:rgba(15,28,60,.04);
  --line-3:rgba(15,28,60,.14);

  /* BRAND NAVY */
  --brand:#1B4FD8;
  --brand-d:#1540B8;
  --brand-l:rgba(27,79,216,.12);
  --brand-bg:rgba(27,79,216,.04);
  --brand-deep:#0F1C3C;

  /* SEMANTIC */
  --pos:#0C9B6A;
  --pos-d:#067A52;
  --pos-bg:rgba(12,155,106,.06);
  --neg:#D84D42;
  --neg-d:#B83A30;
  --neg-bg:rgba(216,77,66,.06);
  --warn:#B45309;
  --warn-bg:rgba(180,83,9,.06);
  --info:#0284C7;
  --info-bg:rgba(2,132,199,.06);

  /* TEXT */
  --t-1:#0F1C3C;
  --t-2:#475569;
  --t-3:#94A3B8;
  --t-4:#CBD5E1;

  /* ASSET CLASS COLORS */
  --c-cash:#0284C7;
  --c-bolsa:#1B4FD8;
  --c-fondos:#8B5CF6;
  --c-pe:#F97316;
  --c-inmob:#EC4899;
  --c-otros:#6B7280;

  /* SHADOWS */
  --sh-xs:0 1px 2px rgba(15,28,60,.04);
  --sh-sm:0 2px 4px rgba(15,28,60,.06);
  --sh-md:0 4px 12px rgba(15,28,60,.08);
  --sh-lg:0 10px 24px rgba(15,28,60,.12);
  --sh-xl:0 20px 40px rgba(15,28,60,.16);

  /* TYPO */
  --display:'Fraunces',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
}

html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--t-1);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ═══ LAYOUT ═══ */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden}
.sb{background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.pages{flex:1;overflow-y:auto;background:var(--bg)}
.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ═══ SIDEBAR ═══ */
.sb-hd{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sb-logo{width:36px;height:36px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:var(--display);font-size:18px;font-weight:600}
.sb-brand{display:flex;flex-direction:column}
.sb-brand-n{font-family:var(--display);font-size:16px;font-weight:600;color:var(--t-1);line-height:1.1}
.sb-brand-s{font-size:10px;color:var(--t-3);text-transform:uppercase;letter-spacing:.5px}

.sb-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:10px;color:var(--t-3);text-transform:uppercase;letter-spacing:.7px;padding:14px 10px 6px;font-weight:600}
.sb-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--t-2);transition:all .15s;display:flex;gap:11px;align-items:center;font-weight:500}
.sb-item:hover{background:var(--surf-3);color:var(--t-1)}
.sb-item.active{background:var(--brand-l);color:var(--brand);font-weight:600}
.sb-ic{font-size:14px;width:18px;text-align:center;opacity:.8}
.sb-item.active .sb-ic{opacity:1}
.sb-badge{margin-left:auto;font-size:10px;background:var(--surf-3);color:var(--t-3);padding:2px 7px;border-radius:8px;font-weight:600}
.sb-item.active .sb-badge{background:var(--brand);color:#fff}

.sb-user{padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;position:relative}
.sb-user:hover{background:var(--surf-2)}
.sb-av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.sb-uname{font-size:12.5px;font-weight:600;color:var(--t-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-uemail{font-size:10.5px;color:var(--t-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══ TOPBAR ═══ */
.top-title{display:flex;flex-direction:column;gap:2px}
.top-h1{font-family:var(--display);font-size:18px;font-weight:500;color:var(--t-1)}
.top-sub{font-size:11px;color:var(--t-3)}
.top-actions{display:flex;gap:8px;align-items:center}

/* ═══ BUTTONS ═══ */
.btn{padding:9px 14px;border-radius:8px;border:none;font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--brand-d);box-shadow:var(--sh-sm)}
.btn-soft{background:var(--brand-bg);color:var(--brand)}
.btn-soft:hover{background:var(--brand-l)}
.btn-ghost{background:transparent;color:var(--t-2);border:1px solid var(--line-3)}
.btn-ghost:hover{background:var(--surf-3);color:var(--t-1)}
.btn-danger{background:var(--neg-bg);color:var(--neg)}
.btn-danger:hover{background:rgba(216,77,66,.14)}
.btn-sm{padding:7px 11px;font-size:11.5px}
.btn-xs{padding:5px 9px;font-size:10.5px}
.btn-lg{padding:12px 18px;font-size:13.5px}

/* ═══ CARDS ═══ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:all .2s}
.card-hover:hover{border-color:var(--line-3);box-shadow:var(--sh-md);cursor:pointer}
.card-hd{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-2)}
.card-ti{font-size:13.5px;font-weight:600;color:var(--t-1)}
.card-bd{padding:18px}

/* ═══ FORMS ═══ */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field-l{font-size:10.5px;font-weight:600;color:var(--t-2);text-transform:uppercase;letter-spacing:.6px}
.fi{padding:10px 12px;border:1px solid var(--line-3);border-radius:8px;font-family:var(--sans);font-size:13px;color:var(--t-1);background:var(--surf);transition:all .15s;width:100%}
.fi:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.fi::placeholder{color:var(--t-4)}
.fs{padding:10px 12px;border:1px solid var(--line-3);border-radius:8px;font-family:var(--sans);font-size:13px;color:var(--t-1);background:var(--surf);width:100%;cursor:pointer}
.fs:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
textarea.fi{resize:vertical;min-height:80px;line-height:1.5}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:10.5px;color:var(--t-3);margin-top:2px}

/* ═══ HERO ═══ */
.hero{background:linear-gradient(135deg,var(--brand-deep) 0%,#1B2F5E 50%,var(--brand) 100%);color:#fff;border-radius:14px;padding:28px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:0;right:0;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%);pointer-events:none}
.hero-l{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.7;margin-bottom:10px;font-weight:600}
.hero-v{font-family:var(--display);font-size:42px;font-weight:400;letter-spacing:-1.5px;line-height:1.1}
.hero-r{margin-top:14px;display:flex;gap:24px;flex-wrap:wrap}
.hero-i{display:flex;flex-direction:column;gap:2px}
.hero-il{font-size:10px;text-transform:uppercase;letter-spacing:.7px;opacity:.6}
.hero-iv{font-family:var(--mono);font-size:14px;font-weight:500}
.hero-iv.up{color:#7FE0BC}
.hero-iv.dn{color:#FCA5A5}

/* ═══ KPIs ═══ */
.kpi-grid{display:grid;gap:12px}
.k2{grid-template-columns:repeat(2,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.k3,.k4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.k2,.k3,.k4{grid-template-columns:1fr}}

.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:all .15s}
.kpi:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--sh-sm)}
.kpi-stripe{position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--brand)}
.kpi-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--t-3);font-weight:600;margin-bottom:6px}
.kpi-v{font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-.5px;color:var(--t-1)}
.kpi-v-mono{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--t-1)}
.kpi-s{font-size:11px;color:var(--t-3);margin-top:2px}

/* ═══ BLOCK CARDS (Patrimonio) ═══ */
.bcard{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:140px}
.bcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh-md)}
.bcard-stripe{position:absolute;top:0;left:0;right:0;height:3px}
.bcard-hd{display:flex;justify-content:space-between;align-items:flex-start}
.bcard-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.bcard-pct{font-size:11px;color:var(--t-3);font-weight:500;padding:3px 8px;border-radius:8px;background:var(--surf-3)}
.bcard-n{font-size:13px;font-weight:600;color:var(--t-1);line-height:1.3}
.bcard-t{font-size:11px;color:var(--t-3)}
.bcard-v{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.5px;color:var(--t-1);margin-top:4px}
.bcard-meta{display:flex;gap:8px;font-size:10.5px;color:var(--t-3);margin-top:auto}

/* ═══ ADD BLOCK BTN ═══ */
.addbtn{background:var(--surf-2);border:2px dashed var(--line-3);border-radius:12px;padding:18px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;gap:6px}
.addbtn:hover{border-color:var(--brand);background:var(--brand-bg);color:var(--brand)}
.addbtn-ic{font-size:24px;font-weight:300;color:var(--t-3)}
.addbtn:hover .addbtn-ic{color:var(--brand)}
.addbtn-l{font-size:12px;font-weight:500;color:var(--t-3)}
.addbtn:hover .addbtn-l{color:var(--brand)}

/* ═══ SECTION HEADERS ═══ */
.sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--t-3);font-weight:600;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:'';display:block;width:3px;height:12px;background:var(--brand);border-radius:2px}
.sec-h .sec-h-sub{margin-left:auto;font-weight:500;color:var(--t-3);font-size:11px}

/* ═══ TABLES ═══ */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:10px 12px;background:var(--surf-2);color:var(--t-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);color:var(--t-2)}
.tbl tr:hover td{background:var(--surf-2);cursor:pointer}
.tbl .r{text-align:right}
.tbl .mono{font-family:var(--mono);font-size:12px}
.tbl .up{color:var(--pos-d);font-weight:500}
.tbl .dn{color:var(--neg);font-weight:500}

/* ═══ PE MULTIPLES ═══ */
.pe-mults{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pe-mult{background:var(--surf-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.pe-mult-l{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--t-3);font-weight:600;margin-bottom:4px}
.pe-mult-v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--t-1)}
.pe-mult-s{font-size:10.5px;color:var(--t-3);margin-top:2px}

/* ═══ CAPITAL BAR ═══ */
.cap-bar{background:var(--surf-3);border-radius:8px;height:8px;overflow:hidden;display:flex}
.cap-seg{height:100%}
.cap-called{background:var(--brand)}
.cap-dist{background:var(--pos)}
.cap-pending{background:var(--warn)}

/* ═══ MODAL ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(15,28,60,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--surf);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-xl);animation:slideUp .25s ease}
.modal.modal-lg{max-width:780px}
.modal.modal-xl{max-width:1000px}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mh-t{font-family:var(--display);font-size:18px;font-weight:500;color:var(--t-1)}
.mh-c{background:none;border:none;cursor:pointer;color:var(--t-3);font-size:20px;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.mh-c:hover{background:var(--surf-3);color:var(--t-1)}
.mb{padding:22px;overflow-y:auto;flex:1}
.mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ═══ UPLOAD ═══ */
.upz{border:2px dashed var(--line-3);border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surf-2)}
.upz:hover,.upz.drag{border-color:var(--brand);background:var(--brand-bg)}
.upz-ic{font-size:32px;color:var(--t-4);margin-bottom:10px}
.upz:hover .upz-ic{color:var(--brand)}
.upz-t{font-size:13px;font-weight:600;color:var(--t-1);margin-bottom:4px}
.upz-s{font-size:11.5px;color:var(--t-3)}

/* ═══ DOCS ═══ */
.doc-item{display:flex;gap:12px;padding:12px;border-radius:10px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.doc-item:hover{background:var(--surf-2);border-color:var(--line)}
.doc-ic{width:38px;height:38px;background:var(--brand-bg);color:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-n{font-size:13px;font-weight:600;color:var(--t-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-m{font-size:10.5px;color:var(--t-3)}
.doc-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.doc-item:hover .doc-actions{opacity:1}

/* ═══ AUTH ═══ */
.auth-screen{min-height:100vh;background:linear-gradient(135deg,var(--surf) 0%,var(--surf-2) 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surf);border-radius:16px;box-shadow:var(--sh-xl);max-width:420px;width:100%;padding:36px}
.auth-logo{width:48px;height:48px;background:var(--brand);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:600;margin:0 auto 20px}
.auth-title{font-family:var(--display);font-size:24px;font-weight:500;text-align:center;color:var(--t-1);margin-bottom:6px}
.auth-sub{font-size:12.5px;color:var(--t-3);text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;background:var(--surf-3);padding:3px;border-radius:8px;margin-bottom:18px}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;color:var(--t-3);cursor:pointer;border-radius:6px;transition:all .15s}
.auth-tab.active{background:var(--surf);color:var(--t-1);box-shadow:var(--sh-xs)}
.auth-sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--t-3);font-size:11px}
.auth-sep::before,.auth-sep::after{content:'';flex:1;height:1px;background:var(--line)}

/* ═══ ONBOARDING ═══ */
.onb-screen{min-height:100vh;background:var(--surf);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.onb-card{max-width:600px;width:100%;padding:40px 24px}
.onb-progress{display:flex;gap:6px;margin-bottom:28px}
.onb-dot{flex:1;height:4px;background:var(--surf-4);border-radius:2px;transition:all .3s}
.onb-dot.active{background:var(--brand)}
.onb-step{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--brand);font-weight:600;margin-bottom:10px}
.onb-title{font-family:var(--display);font-size:28px;font-weight:500;color:var(--t-1);margin-bottom:8px;line-height:1.2}
.onb-sub{font-size:13.5px;color:var(--t-3);margin-bottom:24px;line-height:1.5}
.onb-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.onb-opt{padding:14px 16px;border:1.5px solid var(--line-3);border-radius:10px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px}
.onb-opt:hover{border-color:var(--brand);background:var(--brand-bg)}
.onb-opt.selected{border-color:var(--brand);background:var(--brand-bg)}
.onb-opt-ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.onb-opt.selected .onb-opt-ic{border-color:var(--brand);background:var(--brand)}
.onb-opt.selected .onb-opt-ic::after{content:'';width:8px;height:8px;background:#fff;border-radius:50%}
.onb-opt-c{flex:1}
.onb-opt-t{font-size:13.5px;font-weight:600;color:var(--t-1);line-height:1.3}
.onb-opt-d{font-size:11.5px;color:var(--t-3);margin-top:2px;line-height:1.4}
.onb-actions{display:flex;gap:10px;justify-content:space-between}

/* ═══ COPILOT/SUGGESTION ═══ */

function showOnboarding() {
  const step = onbSteps[onbStep];
  const total = onbSteps.length;
  let progressHTML = '';
  for (let i = 0; i < total; i++) {
    progressHTML += `<div class="onb-dot ${i <= onbStep ? 'active' : ''}"></div>`;
  }

  let bodyHTML = '';
  if (step.type === 'single' || step.type === 'multi') {
    bodyHTML = '<div class="onb-opts">';
    step.options.forEach(opt => {
      const selected = step.type === 'multi'
        ? (onbData[step.field] || []).includes(opt.v)
        : onbData[step.field] === opt.v;
      bodyHTML += `
        <div class="onb-opt ${selected?'selected':''}" onclick="onbSel('${step.field}','${opt.v}','${step.type}')">
          <div class="onb-opt-ic"></div>
          <div class="onb-opt-c">
            <div class="onb-opt-t">${esc(opt.t)}</div>
            <div class="onb-opt-d">${esc(opt.d)}</div>
          </div>
        </div>
      `;
    });
    bodyHTML += '</div>';
  } else if (step.type === 'input') {
    bodyHTML = `
      <div class="field" style="margin-bottom:24px">
        <div style="display:flex;gap:8px;align-items:center">
          <input class="fi" type="number" id="onb-input" placeholder="${step.placeholder}" value="${onbData[step.field]||''}" style="flex:1">
          ${step.suffix ? `<div style="color:var(--t-3);font-size:13px;font-weight:600">${step.suffix}</div>`:''}
        </div>
      </div>
    `;
  }

  const isLast = onbStep === total - 1;
  $('onb-content').innerHTML = `
    <div class="onb-progress">${progressHTML}</div>
    <div class="onb-step">Paso ${onbStep + 1} de ${total}</div>
    <div class="onb-title">${esc(step.title)}</div>
    <div class="onb-sub">${esc(step.sub)}</div>
    ${bodyHTML}
    <div class="onb-actions">
      <button class="btn btn-ghost" onclick="onbBack()" ${onbStep===0?'style="visibility:hidden"':''}>← Atrás</button>
      <button class="btn btn-primary" onclick="onbNext()">${isLast ? 'Completar →' : 'Continuar →'}</button>
    </div>
  `;
}

function onbSel(field, value, type) {
  if (type === 'multi') {
    onbData[field] = onbData[field] || [];
    if (onbData[field].includes(value)) {
      onbData[field] = onbData[field].filter(v => v !== value);
    } else {
      onbData[field].push(value);
    }
  } else {
    onbData[field] = value;
  }
  showOnboarding();
}

function onbBack() {
  if (onbStep > 0) { onbStep--; showOnboarding(); }
}

async function onbNext() {
  const step = onbSteps[onbStep];
  if (step.type === 'input') {
    const v = val('onb-input');
    if (v) onbData[step.field] = parseFloat(v);
  }
  if (onbStep < onbSteps.length - 1) {
    onbStep++;
    showOnboarding();
  } else {
    // Save profile
    onbData.onboarding_complete = true;
    if (!demo) {
      try {
        await sb.from('profiles').upsert({user_id: user.id, ...onbData});
      } catch(e) { console.error(e); }
    }
    userProfile = onbData;
    showApp();
  }
}

function computeProactiveSuggestions(t, byType, cashNoRem, unfunded) {
  const sugs = [];
  const active = blocks.filter(b => !b.deleted);

  // Recordatorio aportación mensual (basado en perfil)
  const hasInvestment = active.some(b => b.type === 'bolsa' || b.type === 'fondos');
  if (hasInvestment) {
    const now = new Date();
    if (now.getDate() >= 5) {
      const monthKey = now.toLocaleDateString('es-ES',{month:'long'});
      sugs.push({
        ic:'📅', tone:'info',
        title:`Aportación de ${monthKey}`,
        body:`Aún no hemos detectado tu aportación mensual de inversión. La constancia es la disciplina inversora más rentable a largo plazo.`,
        actions:`<div style="margin-top:10px;display:flex;gap:6px">
          <button class="btn btn-primary btn-xs" onclick="openMonthlyContribution()">Ya he aportado ✓</button>
          <button class="btn btn-ghost btn-xs" onclick="toast('Recordaremos más tarde')">Más tarde</button>
        </div>`
      });
    }
  }

  // Cash improductivo con cálculo real
  if (cashNoRem > 3000) {
    const annualLoss = cashNoRem * 0.03;
    sugs.push({
      ic:'⚠', tone:'warn',
      title:'Cash improductivo detectado',
      body:`<strong>${fE(cashNoRem)}</strong> en cuentas sin remunerar. A un 3% anual pierdes aproximadamente <strong>${fE(annualLoss)}</strong> en coste de oportunidad. Trade Republic (3.25%), Revolut Vault o MyInvestor lo resuelven rápido.`,
      actions:`<button class="btn btn-soft btn-xs" style="margin-top:8px" onclick="gotoTypeOrBlock('cash')">Revisar cuentas →</button>`
    });
  }

  // Compromiso PE vs liquidez
  if (unfunded > 0) {
    const cashTotal = byType.cash || 0;
    const ratio = cashTotal > 0 ? unfunded / cashTotal : 999;
    if (ratio > 0.7) {
      sugs.push({
        ic:'!', tone:'warn',
        title:'Liquidez ajustada para compromisos PE',
        body:`Tu cash (${fE(cashTotal)}) solo cubre ${cashTotal>0?(1/ratio).toFixed(1):0}× el compromiso pendiente de ${fE(unfunded)}. Si llegan capital calls simultáneas podrías tener problema.`,
      });
    }
  }

  // Concentración
  if (active.length > 1 && t > 0) {
    const sorted = [...active].sort((a,b) => (b.eur_value||b.value||0) - (a.eur_value||a.value||0));
    const top = sorted[0];
    const topPct = ((top.eur_value||top.value||0)/t)*100;
    if (topPct > 50) {
      sugs.push({
        ic:'⚖', tone:'warn',
        title:'Posición muy concentrada',
        body:`<strong>${esc(top.name)}</strong> representa el ${topPct.toFixed(0)}% de tu patrimonio. Si esa posición pierde un 20%, pierdes <strong>${fE((top.eur_value||top.value||0)*0.2)}</strong> de golpe.`,
        actions:`<button class="btn btn-soft btn-xs" style="margin-top:8px" onclick="gotoBlock('${top.id}')">Ver posición →</button>`
      });
    }
  }

  // Drawdown
  if (history.length >= 3) {
    const max = Math.max(...history.map(h => h.total));
    if (max > 0) {
      const dd = ((t - max) / max) * 100;
      if (dd < -8) {
        sugs.push({
          ic:'🧠', tone:'neg',
          title:`Drawdown: mantén la calma`,
          body:`Tu patrimonio ha caído ${dd.toFixed(1)}% desde el máximo reciente (${fE(max)}). Los drawdowns del 10-15% son normales en carteras bien diversificadas. <strong>No tomes decisiones impulsivas.</strong>`,
        });
      }
    }
  }

  return sugs;
}

let chartRange = '6M';
function setChartRange(r) {
  chartRange = r;
  ['1m','3m','6m','1y'].forEach(k => {
    const el = $(`rng-${k}`);
    if (el) {
      const active = k.toUpperCase() === r;
      el.style.background = active ? 'var(--brand-bg)' : '';
      el.style.color = active ? 'var(--brand)' : '';
      el.style.borderColor = active ? 'var(--brand)' : '';
    }
  });
  drawEvolutionChart();
}

function drawEvolutionChart() {
  const canvas = $('chart-evol');
  if (!canvas || !window.Chart) return;
  if (charts.evol) charts.evol.destroy();

  let h = [...history];
  const now = new Date();
  if (chartRange === '1M') {
    const cutoff = new Date(now); cutoff.setMonth(cutoff.getMonth()-1);
    h = h.filter(x => new Date(x.date) >= cutoff);
  } else if (chartRange === '3M') {
    const cutoff = new Date(now); cutoff.setMonth(cutoff.getMonth()-3);
    h = h.filter(x => new Date(x.date) >= cutoff);
  } else if (chartRange === '1Y') {
    const cutoff = new Date(now); cutoff.setFullYear(cutoff.getFullYear()-1);
    h = h.filter(x => new Date(x.date) >= cutoff);
  }
  if (h.length < 2) h = [...history];

  const labels = h.map(x => new Date(x.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'}));
  const data = h.map(x => x.total);

  // S&P 500 simulado: igual % de crecimiento desde el primer punto
  const sp500 = h.map((x,i) => {
    if (i === 0) return data[0];
    const monthlyReturn = 1.007; // ~9% anual
    return data[0] * Math.pow(monthlyReturn, i);
  });

  charts.evol = new Chart(canvas, {
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'Tu patrimonio', data, borderColor:'#1B4FD8', backgroundColor:'rgba(27,79,216,.08)', tension:.3, fill:true, borderWidth:2.5, pointRadius:3, pointBackgroundColor:'#1B4FD8'},
        {label:'S&P 500 (ref)', data:sp500, borderColor:'#94A3B8', tension:.3, fill:false, borderWidth:1.5, pointRadius:0, borderDash:[4,4]},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10},color:'#94A3B8'}}},
      scales:{
        y:{ticks:{callback:v=>v>=1000?(v/1000).toFixed(0)+'K':''+v,font:{size:10},color:'#94A3B8'},grid:{color:'rgba(15,28,60,.05)'}},
        x:{ticks:{font:{size:10},color:'#94A3B8'},grid:{display:false}}
      }
    }
  });
}


// ───── PATRIMONIO (con click en activos arreglado) ─────
function renderPatr() {
  const p = $('p-patrimonio');
  const t = total();
  let html = `<div class="pc">`;

  if (blocks.filter(b => !b.deleted).length === 0) {
    html += `
      <div class="empty">
        <div class="empty-ic">◇</div>
        <div class="empty-t">Empieza añadiendo tus primeros activos</div>
        <div class="empty-s">Conecta cuentas, registra inversiones y centraliza tu patrimonio. WealthOS hará el resto.</div>
        <button class="btn btn-primary" onclick="openAddBlock()">+ Añadir mi primer activo</button>
      </div>
    `;
    p.innerHTML = html + '</div>';
    return;
  }

  // Agrupar por tipo
  const used = new Set();
  blocks.filter(b => !b.deleted).forEach(b => used.add(b.type));
  const ordered = ['cash','bolsa','fondos','pe','inmobiliario','otros'].filter(t => used.has(t));

  ordered.forEach(type => {
    const grp = blocks.filter(b => !b.deleted && b.type === type);
    if (grp.length === 0) return;
    const typeTotal = grp.reduce((s,b) => s + (b.eur_value||b.value||0), 0);
    const pct = t ? (typeTotal/t)*100 : 0;

    html += `<div class="sec-h">${BT[type].icon} ${BT[type].label}<span class="sec-h-sub">${fE(typeTotal)} · ${pct.toFixed(1)}%</span></div>`;
    html += `<div class="kpi-grid k3" style="gap:14px;margin-bottom:18px">`;

    grp.forEach(b => {
      const v = b.eur_value||b.value||0;
      const blockPct = t ? (v/t)*100 : 0;
      html += `
        <div class="bcard" onclick="gotoBlock('${b.id}')">
          <div class="bcard-stripe" style="background:var(--c-${type==='inmobiliario'?'inmob':type})"></div>
          <div class="bcard-hd">
            <div class="bcard-ic" style="background:${BT[type].bg};color:${BT[type].color}">${BT[type].icon}</div>
            <div class="bcard-pct">${blockPct.toFixed(1)}%</div>
          </div>
          <div>
            <div class="bcard-n">${esc(b.name)}</div>
            <div class="bcard-t">${esc(BT[type].label)}</div>
          </div>
          <div class="bcard-v">${fE(v)}</div>
          ${b.notes?`<div class="bcard-meta">${esc(b.notes).slice(0,60)}${b.notes.length>60?'...':''}</div>`:''}
        </div>
      `;
    });

    // Add button para este tipo
    html += `
      <div class="addbtn" onclick="openAddBlock('${type}')">
        <div class="addbtn-ic">+</div>
        <div class="addbtn-l">Añadir ${BT[type].label.toLowerCase()}</div>
      </div>
    `;

    html += `</div>`;
  });

  // Tipos no usados (para añadir nuevos)
  const unused = ['cash','bolsa','fondos','pe','inmobiliario','otros'].filter(t => !used.has(t));
  if (unused.length > 0) {
    html += `<div class="sec-h">⊕ Añadir nuevos tipos<span class="sec-h-sub">${unused.length} disponibles</span></div>`;
    html += `<div class="kpi-grid k3" style="gap:14px">`;
    unused.forEach(type => {
      html += `
        <div class="addbtn" onclick="openAddBlock('${type}')">
          <div class="addbtn-ic" style="color:${BT[type].color}">${BT[type].icon}</div>
          <div class="addbtn-l" style="color:var(--t-2)">${BT[type].label}</div>
          <div style="font-size:10.5px;color:var(--t-3);text-align:center;margin-top:2px">${esc(BT[type].desc)}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  html += `</div>`;
  p.innerHTML = html;
}

// ───── BOLSA SECTION (con posiciones detalladas) ─────
function renderBolsaSection(b) {
  const e = b.extra||{};
  const positions = e.positions || [];
  
  // Cálculos por posición
  const enriched = positions.map((p,idx) => {
    const shares = p.shares || 0;
    const entryPrice = p.entry_price || 0;
    const currentPrice = p.current_price || p.entry_price || 0;
    const mv = shares * currentPrice;
    const cost = shares * entryPrice;
    const pnl = mv - cost;
    const pnlPct = cost > 0 ? (pnl/cost)*100 : 0;
    return {...p, idx, shares, entryPrice, currentPrice, mv, cost, pnl, pnlPct, classification: p.classification || 'core'};
  });
  
  const totalMV = enriched.reduce((s,p) => s + p.mv, 0);
  const totalCost = enriched.reduce((s,p) => s + p.cost, 0);
  const totalPnl = totalMV - totalCost;
  const totalPnlPct = totalCost > 0 ? (totalPnl/totalCost)*100 : 0;
  
  // Split Core / Táctico
  const coreMV = enriched.filter(p => p.classification === 'core').reduce((s,p) => s + p.mv, 0);
  const tacticalMV = enriched.filter(p => p.classification === 'tactical').reduce((s,p) => s + p.mv, 0);
  const corePct = totalMV > 0 ? (coreMV/totalMV)*100 : 0;
  const tacticalPct = totalMV > 0 ? (tacticalMV/totalMV)*100 : 0;
  
  const winners = enriched.filter(p => p.pnl > 0).length;
  const losers = enriched.filter(p => p.pnl < 0).length;
  
  // Ordenar por peso descendente
  enriched.sort((a,b) => b.mv - a.mv);
  
  // Top winner / loser
  const topWinner = [...enriched].sort((a,b) => b.pnl - a.pnl)[0];
  const topLoser = [...enriched].sort((a,b) => a.pnl - b.pnl)[0];
  
  // Avisos cartera
  const alerts = [];
  enriched.forEach(p => {
    const weight = totalMV > 0 ? (p.mv/totalMV)*100 : 0;
    if (weight > 25 && enriched.length > 1) {
      alerts.push({ic:'⚖', tone:'warn', msg:`<strong>${esc(p.ticker)}</strong> = ${weight.toFixed(0)}% de tu cartera (concentración alta)`});
    }
    if (p.pnlPct < -20 && p.cost > 100) {
      alerts.push({ic:'📉', tone:'neg', msg:`<strong>${esc(p.ticker)}</strong> pierde ${p.pnlPct.toFixed(0)}% (${fE(p.pnl)}). ¿Mantienes la tesis?`});
    }
  });
  if (tacticalPct > 30) {
    alerts.push({ic:'!', tone:'warn', msg:`Tu cartera táctica es <strong>${tacticalPct.toFixed(0)}%</strong>. Una buena regla: Core ≥70%, Táctico ≤30%.`});
  }

  return `
    <!-- KPIs principales -->
    <div class="kpi-grid k4" style="margin-bottom:18px">
      <div class="kpi"><div class="kpi-stripe" style="background:var(--c-bolsa)"></div><div class="kpi-l">Valor de mercado</div><div class="kpi-v">${fE(totalMV || b.value || 0)}</div><div class="kpi-s">${enriched.length} ${enriched.length===1?'posición':'posiciones'}</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--c-otros)"></div><div class="kpi-l">Coste total</div><div class="kpi-v">${fE(totalCost)}</div><div class="kpi-s">Capital invertido</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:${totalPnl>=0?'var(--pos)':'var(--neg)'}"></div><div class="kpi-l">P&L total</div><div class="kpi-v" style="color:${totalPnl>=0?'var(--pos-d)':'var(--neg)'}">${totalPnl>=0?'+':''}${fE(totalPnl)}</div><div class="kpi-s" style="color:${totalPnl>=0?'var(--pos-d)':'var(--neg)'}">${totalPnl>=0?'+':''}${totalPnlPct.toFixed(2)}%</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--brand)"></div><div class="kpi-l">Win rate</div><div class="kpi-v">${winners}/${enriched.length}</div><div class="kpi-s">${winners} verdes · ${losers} rojas</div></div>
    </div>

    <!-- Split Core / Táctico -->
    ${enriched.length > 0 ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-hd">
        <div>
          <div class="card-ti">Estrategia de cartera</div>
          <div style="font-size:11px;color:var(--t-3);margin-top:2px">Core = posiciones largo plazo · Táctico = oportunidades, rotación más alta</div>
        </div>
      </div>
      <div class="card-bd">
        <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surf-3);margin-bottom:14px">
          ${corePct > 0 ? `<div style="background:var(--brand);width:${corePct}%"></div>` : ''}
          ${tacticalPct > 0 ? `<div style="background:var(--c-pe);width:${tacticalPct}%"></div>` : ''}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px">
          <div style="padding:12px;background:rgba(27,79,216,.05);border-radius:8px;border-left:3px solid var(--brand)">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <span style="font-weight:600;color:var(--brand)">⬢ Core</span>
              <span class="mono" style="font-size:11px;color:var(--t-3)">${enriched.filter(p=>p.classification==='core').length} pos.</span>
            </div>

// ───── ADD/EDIT BLOCK MODAL (inteligente con tipo, validación) ─────
function openAddBlock(presetType) {
  editingBlock = null;
  openBlockModal(presetType||'cash', null);
}

function openEditBlock(blockId) {
  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  editingBlock = b;
  openBlockModal(b.type, b);
}

function switchBlockType(type) {
  // Solo afecta cuando estamos creando (no editando)
  ['cash','bolsa','fondos','pe','inmobiliario','otros'].forEach(t => {
    const el = document.getElementById(`bt-${t}`);
    if (el) {
      el.style.borderColor = t === type ? 'var(--brand)' : 'var(--line-3)';
      el.style.background = t === type ? 'var(--brand-bg)' : 'var(--surf)';
    }
  });
  // Cambiar campos
  const oldName = val('bl-name');
  const oldVal = val('bl-value');
  const oldNotes = val('bl-notes');
  openBlockModal(type, null);
  if (oldName) $('bl-name').value = oldName;
  if (oldVal) $('bl-value').value = oldVal;
  if (oldNotes) $('bl-notes').value = oldNotes;
}

function getTypePlaceholder(type) {
  return {
    cash: 'Openbank, Revolut...',
    bolsa: 'IBKR, Degiro...',
    fondos: 'Indexa Capital, MyInvestor...',
    pe: 'Nombre del fondo SCR...',
    inmobiliario: 'Piso Barcelona...',
    otros: 'Nombre del activo'
  }[type] || 'Nombre';
}

async function saveBlock(type, blockId) {
  const name = val('bl-name').trim();
  const value = parseFloat(val('bl-value')) || 0;
  const currency = val('bl-currency') || 'EUR';
  const notes = val('bl-notes').trim();

  if (!name) return toast('Nombre obligatorio','err');

  // Build extra
  const extra = {};
  if (type === 'cash') {
    extra.remunerada = val('bl-remunerada') === 'true';
    if (val('bl-tipo')) extra.tipo = parseFloat(val('bl-tipo'));
  }
  if (type === 'bolsa') {
    if (val('bl-broker')) extra.broker = val('bl-broker').trim();
  }
  if (type === 'fondos') {
    if (val('bl-gestora')) extra.gestora = val('bl-gestora').trim();
    if (val('bl-fee')) extra.fee = parseFloat(val('bl-fee'));
    if (val('bl-estrategia-f')) extra.estrategia = val('bl-estrategia-f').trim();
  }
  if (type === 'pe') {
    if (val('bl-gp')) extra.gp = val('bl-gp').trim();
    if (val('bl-vintage')) extra.vintage = val('bl-vintage').trim();
    if (val('bl-estrategia')) extra.estrategia = val('bl-estrategia').trim();
    if (val('bl-geografia')) extra.geografia = val('bl-geografia').trim();
    if (val('bl-committed')) extra.committed = parseFloat(val('bl-committed'));
    if (val('bl-called')) extra.called = parseFloat(val('bl-called'));
    if (val('bl-distributed')) extra.distributed = parseFloat(val('bl-distributed'));
    if (val('bl-tvpi')) extra.tvpi = parseFloat(val('bl-tvpi'));
    if (val('bl-dpi')) extra.dpi = parseFloat(val('bl-dpi'));
    if (val('bl-irr')) extra.irr = parseFloat(val('bl-irr'));
  }
  if (type === 'inmobiliario') {
    if (val('bl-tipo-inm')) extra.tipo = val('bl-tipo-inm');
    if (val('bl-m2')) extra.m2 = parseInt(val('bl-m2'));
    if (val('bl-direccion')) extra.direccion = val('bl-direccion').trim();
    if (val('bl-hipoteca')) extra.hipoteca = parseFloat(val('bl-hipoteca'));
  }

  // Preservar positions de bolsa al editar
  if (blockId && type === 'bolsa') {
    const existingBlock = blocks.find(b => b.id === blockId);
    if (existingBlock?.extra?.positions) {
      extra.positions = existingBlock.extra.positions;
    }
  }

  const blockData = {
    type, name, value, eur_value: value, currency, notes, extra,
    updated_at: new Date().toISOString()
  };

  if (blockId) {
    // UPDATE
    const idx = blocks.findIndex(x => x.id === blockId);
    if (idx >= 0) blocks[idx] = {...blocks[idx], ...blockData};
    await saveBlockDB(blocks[idx]);
    toast('✓ Activo actualizado');
  } else {
    // CREATE
    const newBlock = {id: gId(), user_id: user?.id, ...blockData, created_at: new Date().toISOString()};
    blocks.push(newBlock);
    await saveBlockDB(newBlock);
    toast('✓ Activo creado');
  }

  await snapshotPatrimonio();
  closeModal();

  if (currentPage === 'block-detail' && editingBlock) {
    renderBlockDetail(editingBlock.id);
  } else {
    renderPatr();
    renderDash();
  }
  renderSidebar();
}

async function saveBlockDB(b) {
  if (demo) return;
  try {
    const payload = {
      id: b.id, user_id: user.id, type: b.type, name: b.name,
      value: b.value, eur_value: b.eur_value, currency: b.currency,
      notes: b.notes, extra: b.extra, updated_at: b.updated_at,
      deleted: !!b.deleted
    };
    await sb.from('blocks').upsert(payload);
  } catch(e) { console.error('save block:', e); }
}

async function deleteBlock(blockId) {
  if (!confirm('¿Eliminar este activo? Se podrá recuperar después si lo necesitas.')) return;
  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  b.deleted = true;
  await saveBlockDB(b);
  await snapshotPatrimonio();
  toast('Activo eliminado');
  goto('patrimonio');
}

async function snapshotPatrimonio() {
  const today = new Date().toISOString().slice(0,10);
  const t = total();
  
  // SAFETY: no guardar snapshot si no hay bloques cargados o el total es 0
  // Esto evitaba el bug de "caída artificial" cuando blocks aún no se cargaba
  if (!blocks || blocks.length === 0) return;
  if (t === 0) return;
  
  if (!demo && user) {
    try {
      await sb.from('patrimonio_history').upsert({user_id: user.id, date: today, total: t});
    } catch(e) {}
  }
  // Actualizar local
  const idx = history.findIndex(h => h.date === today);
  if (idx >= 0) history[idx].total = t;
  else history.push({date: today, total: t});
}

// Limpia puntos del historial que sean obviamente erróneos (caídas artificiales a 0 o casi 0)
function cleanupHistoryAnomalies() {
  if (history.length < 3) return false;
  const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
  // Si hay un punto con total < 10% del promedio de sus vecinos, es un error
  const median = [...sorted].map(h => h.total).sort((a,b) => a-b)[Math.floor(sorted.length/2)];
  const threshold = median * 0.3;
  
  const cleaned = sorted.filter(h => h.total > threshold);
  if (cleaned.length < sorted.length) {
    const removed = sorted.length - cleaned.length;
    history = cleaned;
    return removed;
  }
  return false;
}

// Reparar historial: borra anomalías de Supabase también
async function repairHistory() {
  const removed = cleanupHistoryAnomalies();
  if (!removed) {
    toast('No se detectaron anomalías en el historial', 'info');
    return;
  }
  
  if (!demo && user) {
    // Resincronizar todo el historial limpio a Supabase
    try {
      // Borrar todo y reinsertar
      await sb.from('patrimonio_history').delete().eq('user_id', user.id);
      for (const h of history) {
        await sb.from('patrimonio_history').insert({user_id: user.id, date: h.date, total: h.total});
      }
    } catch(e) { console.error('repair history:', e); }
  }
  
  toast(`✓ ${removed} ${removed===1?'anomalía corregida':'anomalías corregidas'}`, 'pos');
  if (currentPage === 'dashboard') renderDash();
}

async function savePosition(blockId, idx) {
  const ticker = val('pos-ticker').trim().toUpperCase();
  const shares = parseFloat(val('pos-shares'))||0;
  const entry = parseFloat(val('pos-entry'))||0;
  const current = parseFloat(val('pos-current')) || entry;
  const date = val('pos-date');
  const thesis = val('pos-thesis').trim();
  const classification = val('pos-classification') || 'core';

  if (!ticker) return toast('Ticker obligatorio','err');
  if (!shares || shares <= 0) return toast('Cantidad inválida','err');
  if (!entry || entry <= 0) return toast('Precio de entrada inválido','err');

  const b = blocks.find(x => x.id === blockId);
  if (!b) return;
  b.extra = b.extra || {};
  b.extra.positions = b.extra.positions || [];

  const pos = {ticker, shares, entry_price: entry, current_price: current, date, thesis, classification};
  if (idx >= 0) b.extra.positions[idx] = pos;
  else b.extra.positions.push(pos);

  // Recalcular valor
  const mv = b.extra.positions.reduce((s,p) => s + (p.shares||0)*(p.current_price||p.entry_price||0), 0);
  b.value = mv; b.eur_value = mv;
  b.updated_at = new Date().toISOString();

  await saveBlockDB(b);
  await snapshotPatrimonio();
  toast(idx >= 0 ? '✓ Posición actualizada' : '✓ Posición añadida');
  closeModal();
  renderBlockDetail(blockId);
  renderSidebar();
}

async function deletePosition(blockId, idx) {
  if (!confirm('¿Eliminar esta posición?')) return;
  const b = blocks.find(x => x.id === blockId);
  if (!b?.extra?.positions) return;
  b.extra.positions.splice(idx, 1);
  const mv = b.extra.positions.reduce((s,p) => s + (p.shares||0)*(p.current_price||p.entry_price||0), 0);
  b.value = mv; b.eur_value = mv;
  b.updated_at = new Date().toISOString();
  await saveBlockDB(b);
  await snapshotPatrimonio();
  toast('Posición eliminada');
  closeModal();
  renderBlockDetail(blockId);
}

async function confirmContributions(numVehicles) {
  const vehicles = blocks.filter(b => !b.deleted && (b.type === 'bolsa' || b.type === 'fondos'));
  let total = 0;
  for (let i = 0; i < numVehicles; i++) {
    const amount = parseFloat(val(`contrib-${i}`)||'0');
    if (amount > 0) {
      const b = vehicles[i];
      b.value = (b.value||0) + amount;
      b.eur_value = (b.eur_value||0) + amount;
      b.updated_at = new Date().toISOString();
      await saveBlockDB(b);
      total += amount;
    }
  }
  if (total > 0) {
    // Reducir cash principal
    const mainCash = blocks.find(b => !b.deleted && b.type === 'cash' && (b.eur_value||b.value||0) >= total);
    if (mainCash) {
      mainCash.value = (mainCash.value||0) - total;
      mainCash.eur_value = (mainCash.eur_value||0) - total;
      mainCash.updated_at = new Date().toISOString();
      await saveBlockDB(mainCash);
    }
    await snapshotPatrimonio();
    toast(`✓ ${fE(total)} aportados y cartera actualizada`);
    closeModal();
    renderDash();
    renderSidebar();
  } else {
    toast('No se introdujo ningún importe','warn');
  }
}

      </div>
      </div>
    `;
    p.innerHTML = html;

  // ═══ ANÁLISIS GLOBAL ═══
  const monthsWithData = flujos.filter(m => (m.items?.length || 0) > 0);

  // Stats por mes
  const monthlyStats = monthsWithData.map(m => {
    let ing = 0, gas = 0;

    m.items.forEach(it => {
      if (it.amount > 0) ing += it.amount;

        gas += Math.abs(it.amount);

    return {month: m.month, items: m.items, ing, gas, ahorro: ing - gas, cats};

  // Totales
  const totalIng = monthlyStats.reduce((s,m) => s + m.ing, 0);
  const totalGas = monthlyStats.reduce((s,m) => s + m.gas, 0);
  const totalAhorro = totalIng - totalGas;
  const avgGas = totalGas / numMonths;
  const avgIng = totalIng / numMonths;
  const avgAhorro = totalAhorro / numMonths;
  const savingsRate = totalIng > 0 ? (totalAhorro / totalIng) * 100 : 0;

  // Categorías globales
  const globalCats = {};
  monthlyStats.forEach(m => {

  // ═══ EVOLUCIÓN DEL AHORRO ═══

  // ═══ GASTOS POR CATEGORÍA ═══

          <div class="card-ti">¿En qué gastas?</div>

            ${catOrder.map(cat => {

                    <span style="font-size:11px;color:var(--t-3)" class="mono">${fE(val)} · ${pct.toFixed(0)}%</span>
                  </div>
                  <div style="height:6px;background:var(--surf-3);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${pct}%;background:${catColors[cat]};transition:width .4s"></div>

              `;

        </div>

  // ═══ COMPARATIVA MENSUAL (con outliers) ═══
  // Detectar outliers por mes vs media
  const flagged = monthlyStats.map(m => {
    const flags = [];
    if (m.gas > avgGas * 1.3) flags.push({type:'gas-high', msg: `${((m.gas/avgGas-1)*100).toFixed(0)}% sobre media`});
    if (m.gas < avgGas * 0.5 && m.items.length > 5) flags.push({type:'gas-low', msg: `${((1-m.gas/avgGas)*100).toFixed(0)}% bajo media`});

    return {...m, flags};

  html += `

            </tr>
          </thead>
          <tbody>
            ${flagged.map(m => {
              const tasa = m.ing > 0 ? (m.ahorro/m.ing)*100 : 0;
              const topCat = Object.entries(m.cats).sort((a,b)=>b[1]-a[1])[0];
              const flagsHTML = m.flags.map(f => {
                const color = f.type === 'gas-high' ? 'var(--neg)' : f.type === 'gas-low' ? 'var(--pos-d)' : 'var(--brand)';
                return `<span style="font-size:9.5px;color:${color};background:${color}15;padding:2px 6px;border-radius:8px;font-weight:600;margin-left:4px">${f.msg}</span>`;
              }).join('');
              return `
                <tr onclick="showMonthDetail('${esc(m.month)}')">
                  <td><strong style="color:var(--t-1)">${esc(m.month)}</strong><br><span style="font-size:10px;color:var(--t-3)">${m.items.length} movs</span></td>
                  <td class="r mono" style="color:${m.ing>0?'var(--pos-d)':'var(--t-4)'}">${m.ing>0?fE(m.ing):'—'}</td>
                  <td class="r mono" style="color:var(--neg)">${fE(m.gas)}${flagsHTML}</td>
                  <td class="r mono" style="font-weight:600;color:${m.ahorro>=0?'var(--pos-d)':'var(--neg)'}">${m.ahorro>=0?'+':''}${fE(m.ahorro)}</td>
                  <td class="r mono">${m.ing>0?tasa.toFixed(0)+'%':'—'}</td>
                  <td>${topCat ? `<span style="font-size:11px">${catIcons[topCat[0]]} ${topCat[0]}: <strong class="mono">${fE(topCat[1])}</strong></span>` : '—'}</td>

  // ═══ HEATMAP CATEGORÍA × MES ═══
  if (numMonths >= 2) {
    // Encontrar máximo de cada categoría para colorear
    const catMaxByMonth = {};
    catOrder.forEach(cat => {
      catMaxByMonth[cat] = Math.max(...monthlyStats.map(m => m.cats[cat]||0));
    });

    html += `
      <div class="card" style="margin-bottom:18px">
        <div class="card-hd">
          <div>
            <div class="card-ti">Calor de gasto por categoría y mes</div>

          </div>
        </div>
        <div style="overflow-x:auto;padding:8px 0">
          <table class="tbl" style="font-size:11.5px">
            <thead>
              <tr>
                <th style="text-align:left;width:130px">Categoría</th>
                ${monthlyStats.map(m => `<th class="r">${esc(m.month.split(' ')[0].slice(0,3))}</th>`).join('')}
                <th class="r">Total</th>
              </tr>
            </thead>
            <tbody>
              ${catOrder.map(cat => {
                const max = catMaxByMonth[cat] || 1;
                const total = monthlyStats.reduce((s,m) => s + (m.cats[cat]||0), 0);
                return `
                  <tr>
                    <td><span style="font-weight:600">${catIcons[cat]} ${cat}</span></td>
                    ${monthlyStats.map(m => {

  const flujoInsights = computeFlujoInsights(monthlyStats, globalCats, totalIng, totalGas, avgGas, avgAhorro, savingsRate, catColors, catIcons);
  if (flujoInsights.length > 0) {
    html += `
      <div class="card" style="margin-bottom:18px">

          </div>

        </div>

            <div class="sug-c">
              <div class="sug-t">${ins.title}</div>
              <div class="sug-b">${ins.body}</div>
            </div>

      </div>

  html += `</div>`;
  p.innerHTML = html;

  // Draw charts después de inyectar
  setTimeout(() => {
    drawAhorroChart(monthlyStats);

function drawAhorroChart(stats) {
  const canvas = $('chart-ahorro');
  if (!canvas || !window.Chart) return;
  if (charts.ahorro) charts.ahorro.destroy();
  const labels = stats.map(m => m.month.split(' ')[0]);
  const ahorros = stats.map(m => Math.round(m.ahorro));
  const ingresos = stats.map(m => Math.round(m.ing));
  const gastos = stats.map(m => -Math.round(m.gas));

  // Línea de tendencia (regresión lineal simple)
  const n = ahorros.length;
  const sumX = ahorros.reduce((s,_,i) => s+i, 0);
  const sumY = ahorros.reduce((s,v) => s+v, 0);
  const sumXY = ahorros.reduce((s,v,i) => s+(i*v), 0);
  const sumXX = ahorros.reduce((s,_,i) => s+(i*i), 0);
  const slope = n > 1 ? (n*sumXY - sumX*sumY)/(n*sumXX - sumX*sumX) : 0;
  const intercept = (sumY - slope*sumX)/n;
  const trend = ahorros.map((_,i) => Math.round(slope*i + intercept));

  charts.ahorro = new Chart(canvas, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Ingresos',data:ingresos,backgroundColor:'rgba(12,155,106,.7)',borderRadius:4,order:3},
        {label:'Gastos',data:gastos,backgroundColor:'rgba(216,77,66,.7)',borderRadius:4,order:3},
        {label:'Ahorro neto',data:ahorros,type:'line',borderColor:'#1B4FD8',backgroundColor:'#1B4FD8',tension:.3,fill:false,borderWidth:2.5,pointRadius:5,pointBackgroundColor:'#1B4FD8',order:1},
        {label:'Tendencia',data:trend,type:'line',borderColor:'rgba(27,79,216,.4)',borderWidth:1.5,borderDash:[6,4],pointRadius:0,fill:false,tension:0,order:2}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10},color:'#94A3B8'}}},
      scales:{
        y:{ticks:{callback:v=>Math.abs(v)>=1000?(v/1000).toFixed(1)+'K':''+v,font:{size:10},color:'#94A3B8'},grid:{color:'rgba(15,28,60,.05)'}},
        x:{ticks:{font:{size:10},color:'#94A3B8'},grid:{display:false}}
      }
    }
  });
}

function drawCatsChart(cats, order, colors) {
  const canvas = $('chart-cats');
  if (!canvas || !window.Chart) return;
  if (charts.cats) charts.cats.destroy();
  const labels = order.filter(c => (cats[c]||0) > 0);
  const data = labels.map(c => Math.round(cats[c]||0));
  const bg = labels.map(c => colors[c]);

  charts.cats = new Chart(canvas, {
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:bg,borderWidth:2,borderColor:'#FFFFFF'}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${fE(ctx.parsed)} (${(ctx.parsed/data.reduce((s,v)=>s+v,0)*100).toFixed(1)}%)`}}
      }
    }
  });
}

function computeFlujoInsights(stats, globalCats, totalIng, totalGas, avgGas, avgAhorro, savingsRate, catColors, catIcons) {
  const ins = [];
  const numMonths = stats.length;
  if (numMonths === 0) return ins;

  // 1. Tendencia ahorro (mejorando/empeorando)
  if (numMonths >= 3) {
    const half = Math.floor(numMonths/2);
    const firstHalf = stats.slice(0, half).reduce((s,m) => s+m.ahorro, 0) / half;
    const secondHalf = stats.slice(-half).reduce((s,m) => s+m.ahorro, 0) / half;
    const delta = secondHalf - firstHalf;
    if (Math.abs(delta) > 30) {
      const mejora = delta > 0;
      ins.push({
        ic: mejora ? '📈' : '📉',
        tone: mejora ? 'pos' : 'neg',
        title: mejora ? 'Tu ahorro está mejorando' : 'Tu ahorro está empeorando',
        body: `En los últimos meses ahorras ${fE(Math.abs(delta))} ${mejora?'más':'menos'} de media que al principio del periodo. ${mejora?'Mantén el ritmo.':'Revisa qué ha cambiado.'}`
      });
    }
  }

  // 2. Tasa de ahorro
  if (totalIng > 0) {
    if (savingsRate >= 30) {
      ins.push({ic:'🏆',tone:'pos',title:`Tasa de ahorro excelente: ${savingsRate.toFixed(0)}%`,body:`Estás ahorrando ${savingsRate.toFixed(0)}% de tus ingresos. Por encima de la media española (~10%) y en territorio FIRE.`});
    } else if (savingsRate >= 15) {
      ins.push({ic:'✓',tone:'pos',title:`Tasa de ahorro saludable: ${savingsRate.toFixed(0)}%`,body:`Por encima del promedio. Si subes al 25-30% acelerarías mucho tu camino patrimonial.`});
    } else if (savingsRate >= 0) {
      ins.push({ic:'⚠',tone:'warn',title:`Tasa de ahorro baja: ${savingsRate.toFixed(0)}%`,body:`Apenas estás ahorrando. Para construir patrimonio sostenible, apunta a un mínimo del 15-20% de tus ingresos.`});
    } else {
      ins.push({ic:'!',tone:'neg',title:`Gastas más de lo que ingresas`,body:`Tus gastos exceden tus ingresos. Necesitas reducir gastos o aumentar ingresos antes que pensar en invertir.`});
    }
  }

  // 3. Mayor categoría de gasto
  const topCat = Object.entries(globalCats).sort((a,b)=>b[1]-a[1])[0];
  if (topCat && totalGas > 0) {
    const pct = (topCat[1]/totalGas)*100;
    ins.push({
      ic: catIcons[topCat[0]] || '◌',
      tone: pct > 35 ? 'warn' : 'info',
      title: `Tu mayor gasto: ${topCat[0]} (${pct.toFixed(0)}% del total)`,
      body: `Has gastado ${fE(topCat[1])} en ${topCat[0]} (${fE(topCat[1]/numMonths)}/mes media)${pct>35?'. Es una concentración alta — vale la pena revisar si todos esos gastos son intencionales.':'.'}`
    });
  }

  // 4. Outliers mensuales
  const maxGastoMonth = [...stats].sort((a,b)=>b.gas-a.gas)[0];
  if (maxGastoMonth && maxGastoMonth.gas > avgGas * 1.4) {
    const exceso = maxGastoMonth.gas - avgGas;
    const topCatMonth = Object.entries(maxGastoMonth.cats).sort((a,b)=>b[1]-a[1])[0];
    ins.push({
      ic:'⚠',
      tone:'warn',
      title:`${maxGastoMonth.month}: gasto inusualmente alto`,
      body:`Gastaste ${fE(maxGastoMonth.gas)} (${((maxGastoMonth.gas/avgGas-1)*100).toFixed(0)}% más que tu media de ${fE(avgGas)}). ${topCatMonth?`Principal categoría: ${topCatMonth[0]} (${fE(topCatMonth[1])}).`:''}`
    });
  }

  // 5. Mes de mejor ahorro
  const bestMonth = [...stats].sort((a,b)=>b.ahorro-a.ahorro)[0];
  if (bestMonth && bestMonth.ahorro > avgAhorro * 1.3 && bestMonth.ahorro > 0) {
    ins.push({
      ic:'⭐',
      tone:'pos',
      title:`Tu mejor mes: ${bestMonth.month}`,
      body:`Ahorraste ${fE(bestMonth.ahorro)}, un ${((bestMonth.ahorro/avgAhorro-1)*100).toFixed(0)}% por encima de tu media. ${bestMonth.ing>0?'Combinaste buenos ingresos con gastos contenidos.':'Mantuviste los gastos a raya.'}`
    });
  }

  // 6. Suscripciones (atención al "goteo")
  const sub = globalCats['Suscripciones'] || 0;
  if (sub > 50 && numMonths > 0) {
    const subAvg = sub/numMonths;
    ins.push({
      ic:'↻',
      tone:'info',
      title:`Suscripciones: ${fE(subAvg)}/mes`,
      body:`Pagas ${fE(sub)} en suscripciones (${fE(subAvg*12)} al año proyectado). Buen momento para auditar: ¿usas todas? Cada 10€/mes que canceles son 120€/año.`
    });
  }

  // 7. Restaurantes vs Supermercado
  const rest = globalCats['Restaurante'] || 0;
  const sup = globalCats['Supermercado'] || 0;
  if (rest > 0 && sup > 0 && rest > sup * 0.8) {
    ins.push({
      ic:'🍽',
      tone:'info',
      title:`Comes fuera casi tanto como cocinas`,
      body:`Restaurantes: ${fE(rest)} · Supermercado: ${fE(sup)}. La proporción habitual saludable es ~30-50% restaurante vs supermercado. Si bajas restaurantes 20€/semana son ~1.000€/año más en tu bolsillo.`
    });
  }

  return ins;
}

async function generateFlujoNarrative() {
  const el = $('flujo-narrative');
  if (!el) return;
  el.innerHTML = `<div style="padding:16px;text-align:center"><div class="dots"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--t-3);margin-top:8px">Generando análisis personalizado...</div></div>`;

  // Construir contexto
  const monthsWithData = flujos.filter(m => (m.items?.length || 0) > 0);
  let ctx = `DATOS DE CASH FLOW DEL USUARIO (${monthsWithData.length} meses):\n\n`;

  const globalCats = {};
  let totalIng = 0, totalGas = 0;

  monthsWithData.forEach(m => {
    let ing = 0, gas = 0;
    const cats = {};
    m.items.forEach(it => {
      if (it.amount > 0) ing += it.amount;
      else {
        gas += Math.abs(it.amount);
        const cat = it.category || 'Otros';
        cats[cat] = (cats[cat]||0) + Math.abs(it.amount);
        globalCats[cat] = (globalCats[cat]||0) + Math.abs(it.amount);
      }
    });
    totalIng += ing; totalGas += gas;
    ctx += `${m.month}: Ingresos ${fE(ing)} · Gastos ${fE(gas)} · Ahorro ${fE(ing-gas)}\n`;
    ctx += `  Categorías: ${Object.entries(cats).map(([c,v])=>`${c}=${fE(v)}`).join(', ')}\n`;
  });
  ctx += `\nTOTAL: Ingresos ${fE(totalIng)} · Gastos ${fE(totalGas)} · Ahorro ${fE(totalIng-totalGas)}\n`;
  ctx += `Tasa de ahorro: ${totalIng>0?((totalIng-totalGas)/totalIng*100).toFixed(1):0}%\n\n`;
  ctx += `Top categorías globales: ${Object.entries(globalCats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c,v])=>`${c} ${fE(v)}`).join(', ')}\n`;

  if (userProfile) {
    ctx += `\nPERFIL DEL USUARIO:\n`;
    if (userProfile.objetivo) ctx += `- Objetivo: ${userProfile.objetivo}\n`;
    if (userProfile.perfil_riesgo) ctx += `- Riesgo: ${userProfile.perfil_riesgo}\n`;
    if (userProfile.ahorro_mensual) ctx += `- Capacidad esperada: ${fE(userProfile.ahorro_mensual)}/mes\n`;
  }

  const prompt = `Eres un analista financiero personal. Analiza los datos de cash flow del usuario y dale un análisis NARRATIVO (no en bullets) de 200-300 palabras EN ESPAÑOL. Cubre:

1. ¿Cómo va su ahorro? ¿Mejora o empeora mes a mes?
2. ¿Dónde se le va más dinero? ¿Hay algo desproporcionado?
3. ¿Hay meses raros con gasto atípico? ¿Por qué probablemente?
4. ¿Qué le recomendarías concretamente para mejorar la tasa de ahorro?

Tono: directo, datos concretos, sin platitudes. Como un asesor de confianza. Párrafos naturales separados por saltos de línea.

${ctx}`;

  try {
    const r = await fetch(AI_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model: AI_MODEL, messages: [{role:'user', content: prompt}], max_tokens: 800})
    });
    const data = await r.json();
    const text = data.choices?.[0]?.message?.content || data.content || '';
    if (!text) throw new Error('empty');
    el.innerHTML = `
      <div style="margin:0 18px 18px;padding:18px;background:var(--brand-bg);border-radius:10px;border-left:3px solid var(--brand)">
        <div style="font-size:11.5px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">✦ Análisis de tu cash flow</div>
        <div style="font-size:13px;color:var(--t-1);line-height:1.75;white-space:pre-wrap">${esc(text)}</div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="margin:0 18px 18px;padding:14px;color:var(--neg);font-size:12px;background:var(--neg-bg);border-radius:8px">El análisis IA no está disponible ahora mismo. Las observaciones automáticas de arriba ya son útiles.</div>`;
  }
}

function saveManualFlujo() {
  const date = val('fl-date');
  const concept = val('fl-concept').trim();
  const amount = parseFloat(val('fl-amount'))||0;
  if (!date || !concept || amount===0) return toast('Completa todos los campos','err');
  const cat = categorizeExpense(concept);
  const monthKey = new Date(date).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let month = flujos.find(m => m.month === monthKey);
  if (!month) { month = {month: monthKey, items:[]}; flujos.push(month); }
  month.items.push({date, concept, amount, category:cat});
  toast('✓ Movimiento añadido');
  closeModal();
  renderFlujos();
}

function categorizeExpense(concept) {
  const c = concept.toLowerCase().trim();
  
  // 1. SUPERMERCADO (alimentación, comida casa)
  if (/(mercadona|condis|carrefour|lidl|dia\b|consum|caprabo|alcampo|aldi|bonpreu|veritas|super\b|botiga|botigueta|forneria|forn\b|panaderia|fruteria|charcuteria|carniceria|pescaderia|macxipa)/i.test(c)) return 'Supermercado';
  
  // 2. RESTAURANTE (comida fuera, bares, cafeterías)
  if (/(dinar|sopar|esmorzar|restaurante|restaurant|cafe|cafeteria|bar\b|cena|comida|deliveroo|glovo|uber\s*eats|just\s*eat|brunch|tapas|menu)/i.test(c)) return 'Restaurante';
  
  // 3. DEPORTE
  if (/(esport|gym|gimnasio|crossfit|padel|tenis|sport|forfait|esqui|ski|piscina|escalada|federacion|club\b|runna|whoop|garmin|strava|decathlon|nike|adidas)/i.test(c)) return 'Deporte';
  
  // 4. OCIO (incluye viajes, regalos, hobbies)
  if (/(cine|teatro|concert|concierto|festival|museo|exposicion|regal|regalo|hotel|airbnb|booking|viaje|trip|formentera|ibiza|mallorca|tunel|tunels|peaje|oci\b|libro|juego|amazon|fnac|mediamarkt|zara|inditex|hm\b|h&m|primark|bershka|pull|stradivarius|tienda|el corte|elcorte|apple store|funda mobil|funda movil|rellotge|estanc)/i.test(c)) return 'Ocio';
  
  // 5. SUSCRIPCIONES (servicios recurrentes)
  if (/(netflix|spotify|hbo|disney|prime|amazon prime|apple\b|icloud|youtube|twitch|patreon|google one|microsoft 365|movistar|vodafone|orange|chatgpt|claude|copilot|notion|dropbox|onedrive|sanitas|adeslas|dkv|asisa)/i.test(c)) return 'Suscripciones';
  
  return 'Otros';
}

function runSimulation() {
  const start = parseFloat(val('sim-start'))||0;
  const monthly = parseFloat(val('sim-monthly'))||0;
  const ret = (parseFloat(val('sim-return'))||7)/100;
  const years = parseInt(val('sim-years'))||20;
  const inf = (parseFloat(val('sim-inflation'))||2.5)/100;

  const mret = Math.pow(1+ret, 1/12)-1;
  const months = years*12;

  function sim(s, m, r) {
    let b = s; const series = [Math.round(b)];
    for (let i=1; i<=months; i++) {
      b = b*(1+r) + m;
      if (i%12===0) series.push(Math.round(b));
    }
    return {final: Math.round(b), series};
  }

  const base = sim(start, monthly, mret);
  const noContrib = sim(start, 0, mret);
  const extra200 = sim(start, monthly+200, mret);
  const noInvest = sim(start, monthly, 0);
  const realFinal = base.final/Math.pow(1+inf, years);
  const totalContrib = start + monthly*months;
  const totalRet = base.final - totalContrib;

  const el = $('sim-results');
  el.innerHTML = `
    <div class="kpi-grid k4" style="margin-bottom:18px">
      <div class="kpi"><div class="kpi-stripe" style="background:var(--brand)"></div><div class="kpi-l">En ${years} años (nominal)</div><div class="kpi-v" style="color:var(--brand)">${fE(base.final)}</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--pos)"></div><div class="kpi-l">Valor real (inflación)</div><div class="kpi-v">${fE(realFinal)}</div><div class="kpi-s">Poder adquisitivo hoy</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--c-fondos)"></div><div class="kpi-l">Rendimientos</div><div class="kpi-v up">${fE(totalRet)}</div></div>
      <div class="kpi"><div class="kpi-stripe" style="background:var(--c-otros)"></div><div class="kpi-l">Total aportado</div><div class="kpi-v">${fE(totalContrib)}</div></div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-hd"><div class="card-ti">Proyección a ${years} años</div></div>
      <div class="card-bd"><canvas id="sim-chart" height="220"></canvas></div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-hd"><div class="card-ti">Escenarios comparados</div></div>
      <table class="tbl">
        <thead><tr><th>Escenario</th><th class="r">Final</th><th class="r">Diferencia</th></tr></thead>
        <tbody>
          <tr style="background:var(--brand-bg)">
            <td><strong style="color:var(--brand)">Tu plan</strong><br><span style="font-size:10.5px;color:var(--t-3)">${fE(monthly)}/mes · ${fP(ret*100)} anual</span></td>
            <td class="r mono" style="font-weight:600">${fE(base.final)}</td>
            <td class="r mono">—</td>
          </tr>
          <tr><td>Sin aportaciones<br><span style="font-size:10.5px;color:var(--t-3)">Solo inversión inicial</span></td><td class="r mono">${fE(noContrib.final)}</td><td class="r mono dn">${fE(noContrib.final-base.final)}</td></tr>
          <tr><td>+200€/mes extra<br><span style="font-size:10.5px;color:var(--t-3)">${fE(monthly+200)}/mes total</span></td><td class="r mono">${fE(extra200.final)}</td><td class="r mono up">+${fE(extra200.final-base.final)}</td></tr>
          <tr><td>Solo ahorro (0%)<br><span style="font-size:10.5px;color:var(--t-3)">No invertido</span></td><td class="r mono">${fE(noInvest.final)}</td><td class="r mono dn">${fE(noInvest.final-base.final)}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-hd"><div class="card-ti">✦ Lo que esto significa</div></div>
      <div class="card-bd" style="font-size:12.5px;color:var(--t-2);line-height:1.7">
        Partiendo de <strong>${fE(start)}</strong> con <strong>${fE(monthly)}/mes</strong> al <strong>${fP(ret*100)}</strong>, en ${years} años llegarías a <strong style="color:var(--brand)">${fE(base.final)}</strong>. Ajustado por inflación del ${fP(inf*100)}, eso equivale a <strong>${fE(realFinal)}</strong> de poder adquisitivo hoy.
        <br><br>
        El <strong>${((totalRet/base.final)*100).toFixed(0)}%</strong> de tu patrimonio final vendría de rendimientos, no de aportaciones. Ese es el interés compuesto trabajando para ti.
        <br><br>
        <strong style="color:var(--pos-d)">Dato clave:</strong> subir solo 200€/mes más significaría <strong>+${fE(extra200.final-base.final)}</strong> extra. Pequeños incrementos hoy = grandes resultados mañana.
      </div>
    </div>
  `;

  setTimeout(() => drawSimChart(base.series, noContrib.series, extra200.series, noInvest.series, years), 50);
}

  const canvas = $('sim-chart');

      {label:'Sin aportaciones',data:noContrib,borderColor:'#B45309',tension:.3,fill:false,borderWidth:1.5,pointRadius:0,borderDash:[4,4]},

function computeInsights(t) {
  const insights = [];
  const active = blocks.filter(b => !b.deleted);
  if (active.length === 0 || t === 0) return insights;

  const byType = {};
  active.forEach(b => { byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0); });

  // 1. Concentración
  const sorted = [...active].sort((a,b) => (b.eur_value||b.value||0) - (a.eur_value||a.value||0));
  const top = sorted[0];
  const topPct = ((top.eur_value||top.value||0)/t)*100;
  if (topPct > 40) {
    insights.push({
      ic:'⚖', tone: topPct>60?'neg':'warn',
      title: `Concentración alta: ${esc(top.name)} = ${topPct.toFixed(0)}%`,
      body: `Una caída del 20% en esta posición te costaría ${fE((top.eur_value||top.value||0)*0.2)}. Estándar diversificación: ninguna posición individual debería superar el 25-30% del total.`,
      action: `<button class="btn btn-soft btn-xs" onclick="gotoBlock('${top.id}')">Ver posición →</button>`
    });
  }

  // 2. Cash improductivo
  const cashNoRem = active.filter(b => b.type==='cash' && !b.extra?.remunerada).reduce((s,b) => s + (b.eur_value||b.value||0), 0);
  if (cashNoRem > 3000) {
    insights.push({
      ic:'💰', tone:'warn',
      title:`${fE(cashNoRem)} en cash sin remunerar`,
      body:`A inflación 3% pierdes ~${fE(cashNoRem*0.03)}/año. Trade Republic (3.25%), Revolut Vault (3%), MyInvestor o BBVA Cuenta Online te pueden dar ese rendimiento manteniendo liquidez.`,
    });
  }

  // 3. Allocation extremos
  const cashPct = ((byType.cash||0)/t)*100;
  if (cashPct > 50) {
    insights.push({
      ic:'⚠', tone:'warn',
      title: `Demasiado peso en liquidez (${cashPct.toFixed(0)}%)`,
      body: `Más de la mitad de tu patrimonio en cash. Bien por la seguridad pero malo para crecer. A largo plazo, la inflación erosiona ese dinero. Un perfil ${userProfile?.perfil_riesgo||'moderado'} sugiere 10-20% en liquidez.`,
    });
  } else if (cashPct < 5 && t > 20000) {
    insights.push({
      ic:'!', tone:'neg',
      title: `Liquidez muy ajustada (${cashPct.toFixed(0)}%)`,
      body: `Tienes solo ${fE(byType.cash||0)} en cash sobre un patrimonio de ${fE(t)}. Lo recomendable: 3-6 meses de gastos en líquido para emergencias. Tu objetivo de liquidez es ${fE(userProfile?.liquidez||10000)}.`,
    });
  }

  // 4. TVPI bajo en PE
  const pePoor = active.filter(b => b.type==='pe' && b.extra?.tvpi && b.extra.tvpi < 1.0);
  pePoor.forEach(b => {
    insights.push({
      ic:'◉', tone:'warn',
      title: `${esc(b.name)}: TVPI por debajo de 1.0x`,
      body: `Este fondo está por debajo del capital invertido (TVPI ${b.extra.tvpi.toFixed(2)}x). Es normal en early-stage VC (J-curve), pero conviene revisar el último report trimestral.`,
      action: `<button class="btn btn-soft btn-xs" onclick="gotoBlock('${b.id}')">Ver fondo →</button>`
    });
  });

  // 5. PE sin actualizar
  active.filter(b => b.type==='pe').forEach(b => {
    const lastUpd = new Date(b.updated_at);
    const monthsAgo = (Date.now() - lastUpd.getTime())/(1000*60*60*24*30);
    if (monthsAgo > 6) {
      insights.push({
        ic:'⏱', tone:'info',
        title: `${esc(b.name)}: sin actualizar hace ${Math.floor(monthsAgo)} meses`,
        body: `Los fondos PE suelen tener reports trimestrales. Si tienes el último report sube el PDF y la IA extraerá las nuevas valoraciones.`,
        action: `<button class="btn btn-soft btn-xs" onclick="openUploadFor('${b.id}')">Subir report →</button>`
      });
    }
  });

  // 6. Evolución histórica
  if (history.length >= 3) {
    const start = history[0].total;
    const growth = ((t-start)/start)*100;
    if (Math.abs(growth) > 3) {
      insights.push({
        ic: growth>=0?'📈':'📉', tone: growth>=0?'pos':'neg',
        title: `Patrimonio ${growth>=0?'+':''}${growth.toFixed(1)}% desde ${fD(history[0].date)}`,
        body: `${growth>=0?'+':''}${fE(t-start)} en ${history.length} meses. ${growth>=0?'Buen ritmo de crecimiento.':'Caída a vigilar; revisa qué bloques han perdido más valor.'}`,
      });
    }
  }

  // 7. Liquidez vs compromiso PE
  const totalCommitted = active.filter(b=>b.type==='pe').reduce((s,b) => s + (b.extra?.committed||0), 0);
  const totalCalled = active.filter(b=>b.type==='pe').reduce((s,b) => s + (b.extra?.called||0), 0);
  const unfunded = totalCommitted - totalCalled;
  if (unfunded > 0 && (byType.cash||0) > 0) {
    const cover = (byType.cash||0)/unfunded;
    if (cover < 1.5 && cover > 0) {
      insights.push({
        ic:'!', tone:'warn',
        title: `Tu cash cubre solo ${cover.toFixed(1)}× tu compromiso PE pendiente`,
        body: `Tienes ${fE(unfunded)} comprometidos en PE pendientes de capital call, y solo ${fE(byType.cash||0)} en cash. Si llegan calls simultáneas podrías tener un problema de liquidez.`,
      });
    }
  }

  return insights;
}

function buildContextualSuggestions() {
  const sugs = [];
  const t = total();
  const active = blocks.filter(b => !b.deleted);
  
  if (active.length === 0) {
    return ['¿Cómo empiezo a estructurar mi patrimonio?','¿Qué cuenta remunerada me recomiendas?','¿Cuánto cash debo tener líquido?'];
  }
  
  // Sugerencias basadas en perfil
  sugs.push('Analiza mi cartera actual');
  
  const byType = {};
  active.forEach(b => { byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0); });
  
  if ((byType.cash||0)/t > 0.4) sugs.push('Tengo mucho cash, ¿qué hago?');
  if (active.some(b => b.type === 'pe')) sugs.push('Evalúa mis posiciones de PE');
  if (active.some(b => b.type === 'bolsa')) sugs.push('Revisa mi cartera de bolsa');
  sugs.push('¿Cómo va mi diversificación?');
  if (userProfile?.objetivo === 'independencia') sugs.push('¿Cuánto necesito para FIRE?');
  
  return sugs.slice(0, 4);

function buildPatrimonialContext() {
  const t = total();
  const active = blocks.filter(b => !b.deleted);
  let ctx = `Patrimonio total: ${fE(t)}\nNúmero de activos: ${active.length}\n\n`;
  
  // Perfil
  if (userProfile) {
    ctx += `PERFIL DEL USUARIO:\n`;
    if (userProfile.perfil_riesgo) ctx += `- Riesgo: ${userProfile.perfil_riesgo}\n`;
    if (userProfile.horizonte) ctx += `- Horizonte: ${userProfile.horizonte} años\n`;
    if (userProfile.objetivo) ctx += `- Objetivo: ${userProfile.objetivo}\n`;
    if (userProfile.ahorro_mensual) ctx += `- Capacidad ahorro: ${fE(userProfile.ahorro_mensual)}/mes\n`;
    if (userProfile.liquidez) ctx += `- Liquidez mínima: ${fE(userProfile.liquidez)}\n`;
    if (userProfile.patrimonio_rango) ctx += `- Rango patrimonial: ${userProfile.patrimonio_rango}\n`;
    ctx += '\n';
  }
  
  // Allocation
  const byType = {};
  active.forEach(b => { byType[b.type] = (byType[b.type]||0) + (b.eur_value||b.value||0); });
  ctx += `ALLOCATION:\n`;
  Object.entries(byType).forEach(([k,v]) => { ctx += `- ${BT[k].label}: ${fE(v)} (${((v/t)*100).toFixed(1)}%)\n`; });
  ctx += '\n';
  
  // Activos detallados
  ctx += `ACTIVOS:\n`;
  active.forEach(b => {
    ctx += `- ${b.name} [${BT[b.type].label}]: ${fE(b.eur_value||b.value||0)}`;
    if (b.notes) ctx += ` - ${b.notes}`;
    if (b.type === 'pe' && b.extra) {
      ctx += ` (Committed: ${fE(b.extra.committed||0)}, Called: ${fE(b.extra.called||0)}`;
      if (b.extra.tvpi) ctx += `, TVPI: ${b.extra.tvpi}x`;
      ctx += ')';
    }
    if (b.type === 'bolsa' && b.extra?.positions) {
      ctx += ` (${b.extra.positions.length} posiciones: ${b.extra.positions.map(p => p.ticker).join(', ')})`;
    }
    ctx += '\n';
  });
  
  // Evolución reciente
  if (history.length >= 2) {
    const delta = t - history[0].total;
    const pct = history[0].total ? (delta/history[0].total)*100 : 0;
    ctx += `\nEVOLUCIÓN (${history.length} meses): ${delta>=0?'+':''}${fE(delta)} (${pct>=0?'+':''}${pct.toFixed(1)}%)\n`;
  }
  
  return ctx;
}

function localChatFallback(q) {
  const ql = q.toLowerCase();
  const t = total();
  if (ql.includes('total') || ql.includes('cuánto') || ql.includes('cuanto')) {
    return `Tu patrimonio total es ${fE(t)} repartido en ${blocks.filter(b=>!b.deleted).length} activos.`;

    return `Tienes ${fE(cash)} en cuentas y liquidez (${((cash/t)*100).toFixed(1)}% del total).`;
  }
  return `He registrado tu pregunta. El advisor IA completo está temporalmente offline, pero puedes ver insights automáticos en la sección de Insights.`;
